# Rough usage estimates so Infracost can price the usage-based parts of S3,
# Lambda, API Gateway, and DynamoDB (storage, requests, compute) — by default
# Infracost assumes zero usage for these, which would understate the real
# cost of running them.
#
# This is the **dev** scenario: development and validation only — ~2 users,
# no scheduled ingestion (fx/stock/etf-ingestion.yml's cron trigger always
# targets production; dev only ever gets manual workflow_dispatch runs, see
# each workflow's "Resolve target environment..." step), and today's small
# packages/{fx,stock,etf}/config/*.dev.yaml lists rather than the ~10,000-
# instrument scale infra/infracost-usage.prod.yml plans production against.
# The session model and per-user rates below are identical to prod's — see
# that file for the full derivation — just applied to 2 users instead of 50.
#
# These are deliberately rough guesses; tune them as real usage becomes
# known. Regenerate the exact supported keys for your Infracost CLI version
# with:
#   infracost breakdown --config-file=infracost.yml --sync-usage-file
version: 0.1
resource_usage:
  # Same session model as infracost-usage.prod.yml (15 HTTP calls/session,
  # 20 sessions/user/month -> 300 HTTP calls/user/month; 1 DynamoDB
  # read/session + 2 flat profile-edit writes/user/month; 14 S3
  # GETs/session against user_data_bucket + 4 flat writes/user/month; 3
  # market-data calls/session -> 60 market_data_bucket GETs/user/month),
  # applied to 2 dev users instead of prod's 50.
  module.backend_lambda.aws_lambda_function.this:
    monthly_requests: 600 # 300 HTTP calls/user/month * 2 users
    request_duration_ms: 300 # rough guess pending a real cold/warm measurement, same as prod

  module.backend_api_gateway.aws_apigatewayv2_api.this:
    monthly_requests: 600 # same 300/user/month * 2 users as the Lambda above

  module.user_profiles_table.aws_dynamodb_table.this:
    monthly_read_request_units: 50 # 20 reads/user/month (1 identity call/session) * 2 users = 40, rounded up
    monthly_write_request_units: 5 # 2 writes/user/month (occasional profile edits, flat) * 2 users = 4, rounded up
    storage_gb: 0.01 # 2 tiny profile records — well under Infracost's practical floor

  # User-owned data bucket (accounts, pies, watchlists, holdings,
  # transactions) — same per-object-size assumptions as
  # infracost-usage.prod.yml, just 2 users' worth of activity.
  module.user_data_bucket.aws_s3_bucket.this:
    standard:
      storage_gb: 0.01
      monthly_tier_1_requests: 10 # PUT — 4 writes/user/month (session model) * 2 users = 8, rounded up
      monthly_tier_2_requests: 600 # GET — 280 reads/user/month (session model) * 2 users = 560, rounded up

  # FX + stock + ETF profile data (and the backend's on-demand search/
  # profile/price cache reads) lands here. No scheduled runs in dev — only
  # manual `workflow_dispatch(environment=dev)` runs against today's small
  # packages/{fx,stock,etf}/config/*.dev.yaml lists, for ad hoc validation.
  # Modeled at ~12 manual runs/month total (within the ~10-15/month
  # expected), split evenly across the three pipelines (~4 each) absent any
  # reason to weight one pipeline's manual testing over another's.
  #
  # --- FX (packages/fx/config/fx_pairs.dev.yaml, currently 4 pairs) ---
  #   size:     profile.parquet ~15KB + metrics.parquet ~10KB +
  #             price.parquet ~20KB (current year only) = ~45KB/pair
  #   storage:  4 pairs * 45KB = 180KB
  #   manual runs: ~4/month
  #   requests: 3 files/pair (profile + metrics + price), all PUT
  #             4 runs * 4 pairs * 3 files = 48 PUTs -> 50 (rounded up)
  #
  # --- Stock (packages/stock/config/stocks.dev.yaml, currently 9 tickers)
  #     --- see infracost-usage.prod.yml's Stock section for the real
  #     per-file size samples this is measured from; same per-ticker
  #     850KB/ticker (20-year accumulated) assumption applies, split the
  #     same way into price/history.parquet+current.parquet there (same
  #     850KB total either way — see that section's note on why
  #     consolidating files doesn't shrink the row data).
  #   storage:  9 tickers * 850KB = 7,650KB
  #   manual runs: ~4/month
  #   requests: 5 files/ticker/run (profile + price + dividend + events +
  #             metrics), all PUT — this flat per-run count is a closer
  #             approximation of a --full-load test run than it was before
  #             the price split: price is now capped at 2 PUTs/ticker
  #             (history.parquet + current.parquet) regardless of a
  #             ticker's history length, vs. up to ~20 PUTs/ticker (one per
  #             year) previously, so a manual --full-load run here no
  #             longer spikes materially above this estimate the way it
  #             could under the old per-year layout
  #             4 runs * 9 tickers * 5 files = 180 PUTs -> 200 (rounded up)
  #
  # --- ETF (packages/etf/config/etfs.dev.yaml, currently 5 tickers) ---
  #     see infracost-usage.prod.yml's ETF section for the real per-file
  #     size samples; same per-ticker 532KB (20-year accumulated) + flat
  #     events overhead assumption applies, same price/history.parquet+
  #     current.parquet split.
  #   storage:  5 tickers * 532KB + 35KB (events, flat: 5 tickers * 7KB) =
  #             2,695KB
  #   manual runs: ~4/month
  #   requests: 5 files/ticker/run, all PUT — same --full-load-friendlier
  #             cap as the Stock section above (price never exceeds 2
  #             PUTs/ticker now, regardless of history length)
  #             4 runs * 5 tickers * 5 files = 100 PUTs
  #
  # --- Totals used below ---
  #   storage:  180KB + 7,650KB + 2,695KB = 10,525KB (~0.01GB, rounded up)
  #   requests (PUT): 50 (FX) + 200 (stock) + 100 (ETF) = 350
  #   requests (GET): 120 — backend on-demand reads, from the session model
  #             above (60/user/month * 2 users), not sized from the ticker
  #             count
  module.market_data_bucket.aws_s3_bucket.this:
    standard:
      storage_gb: 0.01
      monthly_tier_1_requests: 350 # PUT/COPY/POST/LIST — FX (50) + stock (200) + ETF (100), manual runs only
      monthly_tier_2_requests: 120 # GET — backend on-demand reads, from the session model above

  # React static site. Build size doesn't depend on traffic, so storage/
  # deploy-sync requests stay the same as infracost-usage.prod.yml's — only
  # page-load traffic (this tier_2) scales with user count. ~100
  # page-loads/user/month (same ratio as prod) * 2 users.
  module.frontend_bucket.aws_s3_bucket.this:
    standard:
      storage_gb: 1
      monthly_tier_1_requests: 500 # one `aws s3 sync` per deploy — deploy-frequency-driven, not user-count-driven, same as prod
      monthly_tier_2_requests: 200 # page loads: 100/user/month * 2 users

  # CloudFront distribution fronting frontend_bucket. Same 100
  # page-loads/user/month * 2 users scenario as frontend_bucket's own
  # monthly_tier_2_requests above; same ~1.5MB average cached bundle weight
  # assumption as infracost-usage.prod.yml. Comfortably inside CloudFront's
  # 1TB/10M-request AWS Free Tier regardless, at this scale.
  aws_cloudfront_distribution.frontend:
    monthly_data_transfer_out_gb: 0.2
    monthly_http_requests: 25
    monthly_https_requests: 200

  # Backend deploy artifacts bucket. Deploy-frequency-driven, not
  # user-count-driven — deliberately the same as infracost-usage.prod.yml's
  # (see that file's comment on this resource for why dev/prod aren't split
  # here despite dev likely deploying more often in practice).
  module.backend_deploy_bucket.aws_s3_bucket.this:
    standard:
      storage_gb: 1
      monthly_tier_1_requests: 20
