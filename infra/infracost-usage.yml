# Rough usage estimates so Infracost can price the usage-based parts of S3 and
# ECR (storage, requests) — by default Infracost assumes zero usage for these,
# which would understate the real cost of running these buckets/repo.
# These are deliberately rough guesses; tune them as real usage becomes known.
# Regenerate the exact supported keys for your Infracost CLI version with:
#   infracost breakdown --config-file=infracost.yml --sync-usage-file
version: 0.1
resource_usage:
  # FX + stock + ETF profile data (and on-demand backend cache reads) lands
  # here. Three independent scheduled pipelines write into this one bucket —
  # broken out per pipeline below, then summed into the storage_gb/
  # monthly_tier_1_requests values actually used. Recompute a pipeline's own
  # lines if its pair/ticker count or schedule changes materially; the other
  # pipelines' lines are unaffected.
  #
  # --- FX (packages/fx/config/fx_pairs.yaml, currently 4 pairs) ---
  #   size:     profile.parquet ~15KB + metrics.parquet ~10KB +
  #             price.parquet ~20KB (current year only — full_load isn't
  #             passed on schedule) = ~45KB/pair
  #   storage:  4 pairs * 45KB = 180KB
  #   schedule: fx-ingestion.yml, cron "0 */6 * * *" -> ~120 runs/month (4/day)
  #   requests: 3 files/pair (profile + metrics + price), all PUT
  #             120 runs * 4 pairs * 3 files = 1,440 PUTs -> 1,500 (rounded up)
  #
  # --- Stock (packages/stock/config/stocks.yaml, currently 9 tickers) ---
  #   size (real samples, not placeholders):
  #     profile.parquet   ~30KB  (one snapshot, overwritten each run)
  #     metrics.parquet   ~20KB  (one snapshot, overwritten each run)
  #     price.parquet     ~20KB/year
  #     dividend.parquet  ~10KB/year
  #     events.parquet    ~10KB/year (equicast-events: earnings/ratings/splits)
  #   Unlike profile/metrics, the three per-year files accumulate one
  #   year=<YYYY> partition per year rather than being overwritten — assuming
  #   20 years of accumulated history per ticker (a full yfinance backfill via
  #   --full-load, then steady-state incremental runs): (20+10+10)KB * 20
  #   years = 800KB/ticker of per-year files, + 30KB + 20KB one-time
  #   snapshots = 850KB/ticker.
  #   storage:  9 tickers * 850KB = 7,650KB
  #   schedule: stock-ingestion.yml, cron "0 2,8,14,20 * * *" -> also
  #             ~120 runs/month (4/day, offset 2h from FX so they never
  #             overlap)
  #   requests: 5 files/ticker/run (profile + price + dividend + events +
  #             metrics — each run only touches the current year's
  #             price/dividend/events file, not the full accumulated
  #             history), all PUT
  #             120 runs * 9 tickers * 5 files = 5,400 PUTs
  #
  # --- ETF (packages/etf/config/etfs.yaml, currently 5 tickers) ---
  #   size (real samples, not placeholders):
  #     profile.parquet    ~22-23KB (one snapshot, overwritten each run) ->
  #                        25KB/ticker rounded up for headroom
  #     price.parquet      ~14KB for a partial (Jan-Aug, 165-row) year,
  #                        measured across VOO/QQQ/VTI/AGG/GLD -> scales to
  #                        ~20KB for a full ~252-trading-day year, same
  #                        figure as the Stock section's price.parquet
  #     dividend.parquet   ~4KB for a partial-year (2-7 rows depending on
  #                        distribution frequency) measured across
  #                        VOO/QQQ/VTI/AGG — GLD pays no dividend at all
  #                        (no file for that ticker/year) -> ~5KB/year for a
  #                        full year, smaller than the Stock section's
  #                        assumed 10KB/year since ETF distributions here
  #                        are quarterly/monthly cash amounts with no other
  #                        per-row fields, not sized from a real stock
  #                        sample there
  #     metrics.parquet    ~6.7KB (one snapshot, overwritten each run),
  #                        identical for every ticker since the schema is
  #                        fixed (11 columns: ticker + 8 metric fields +
  #                        last_updated + source) -> 7KB/ticker rounded up.
  #                        Only MetricsClient.metrics() (risk/performance) —
  #                        no .fundamentals() (stock-only, mostly None for
  #                        ETFs), so notably smaller than the Stock
  #                        section's 20KB metrics.parquet (23 columns,
  #                        risk + fundamentals merged)
  #     events.parquet     ~7.2KB per file that actually exists (measured:
  #                        one "split" row via a --full-load run). Unlike
  #                        price/dividend, this is NOT one file per ticker
  #                        per year — earnings/analyst-rating events are
  #                        always empty for an ETF (no earnings or analyst
  #                        coverage), so a file is only ever written for a
  #                        ticker-year with an actual split. Real full
  #                        history check: VOO/QQQ/VTI each have exactly one
  #                        split ever (VOO 2013, QQQ 2000, VTI 2008); AGG/GLD
  #                        have none. Modeled as up to 1 accumulated events
  #                        file per ticker (not *20 years like price/
  #                        dividend) for headroom: 5 tickers * 7KB = 35KB
  #                        total, not per-ticker.
  #   Unlike profile/metrics, price.parquet/dividend.parquet accumulate one
  #   year=<YYYY> partition per year rather than being overwritten —
  #   assuming 20 years of accumulated history per ticker (same assumption
  #   as the Stock section): (20+5)KB * 20 years = 500KB/ticker of per-year
  #   files, + 25KB + 7KB one-time snapshots = 532KB/ticker.
  #   storage:  5 tickers * 532KB + 35KB (events, flat) = 2,695KB
  #   schedule: etf-ingestion.yml, cron "0 4,10,16,22 * * *" -> also
  #             ~120 runs/month (4/day, offset 4h from FX and 2h from stock
  #             so none of the three ever overlap)
  #   requests: 5 files/ticker/run (profile + price + dividend + events +
  #             metrics — same conservative per-run ceiling the Stock
  #             section uses, even though events.parquet in particular
  #             produces an actual upload in only a small fraction of runs
  #             — most ticker-years have no split), all PUT
  #             120 runs * 5 tickers * 5 files = 3,000 PUTs
  #
  # --- Totals used below ---
  #   storage:  180KB + 7,650KB + 2,695KB = 10,525KB (~0.01GB) -> 0.01GB
  #             (rounded up). Recompute the accumulated-years assumption in
  #             the stock/ETF sections once actual bucket age approaches (or
  #             exceeds) 20 years, or once --full-load has actually been run
  #             and real multi-year sizes are known instead of the 20-year
  #             projection.
  #   requests: 1,500 (FX) + 5,400 (stock) + 3,000 (ETF) = 9,900
  module.market_data_bucket.aws_s3_bucket.this:
    standard:
      storage_gb: 0.01
      monthly_tier_1_requests: 9900 # PUT/COPY/POST/LIST — FX (1,500) + stock (5,400) + ETF (3,000), all every 6h (offset)
      monthly_tier_2_requests: 20000 # GET — backend reads on demand, not sized from pair/ticker estimates

  # React static site — small, but re-synced (and re-read by every visitor)
  # on every deploy.
  module.frontend_bucket.aws_s3_bucket.this:
    standard:
      storage_gb: 1
      monthly_tier_1_requests: 500 # one `aws s3 sync` per deploy
      monthly_tier_2_requests: 50000 # page loads

  # Backend image. A lifecycle policy caps this repo at the 2 most recently
  # pushed images, so this is ~2x a single image's size, not unbounded.
  module.backend_ecr.aws_ecr_repository.this:
    storage_gb: 2
