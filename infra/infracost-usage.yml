# Rough usage estimates so Infracost can price the usage-based parts of S3 and
# ECR (storage, requests) — by default Infracost assumes zero usage for these,
# which would understate the real cost of running these buckets/repo.
# These are deliberately rough guesses; tune them as real usage becomes known.
# Regenerate the exact supported keys for your Infracost CLI version with:
#   infracost breakdown --config-file=infracost.yml --sync-usage-file
version: 0.1
resource_usage:
  # FX + stock profile data (and on-demand backend cache reads) lands here.
  # Two independent scheduled pipelines write into this one bucket — broken
  # out per pipeline below, then summed into the storage_gb/
  # monthly_tier_1_requests values actually used. Recompute a pipeline's own
  # lines if its pair/ticker count or schedule changes materially; the other
  # pipeline's lines are unaffected.
  #
  # --- FX (packages/fx/config/fx_pairs.yaml, currently 4 pairs) ---
  #   size:     profile.parquet ~15KB + metrics.parquet ~10KB +
  #             price.parquet ~20KB (current year only — full_load isn't
  #             passed on schedule) = ~45KB/pair
  #   storage:  4 pairs * 45KB = 180KB
  #   schedule: fx-ingestion.yml, cron "0 */6 * * *" -> ~120 runs/month (4/day)
  #   requests: 3 files/pair (profile + metrics + price), all PUT
  #             120 runs * 4 pairs * 3 files = 1,440 PUTs -> 1,500 (rounded up)
  #
  # --- Stock (packages/stock/config/stocks.yaml, currently 9 tickers) ---
  #   size:     profile.parquet only (no metrics/prices yet) — no real sample
  #             yet, assumed ~45KB/ticker as a placeholder (same order of
  #             magnitude as FX's combined per-pair footprint above); replace
  #             with a real estimate once known.
  #   storage:  9 tickers * 45KB = 405KB
  #   schedule: stock-ingestion.yml, cron "0 2,8,14,20 * * *" -> also
  #             ~120 runs/month (4/day, offset 2h from FX so they never
  #             overlap)
  #   requests: 1 file/ticker (profile only), PUT
  #             120 runs * 9 tickers * 1 file = 1,080 PUTs -> 1,100 (rounded up)
  #
  # --- Totals used below ---
  #   storage:  180KB + 405KB = 585KB (~0.0006GB) -> 0.01GB (rounded up for
  #             headroom). Neither pipeline's figure accounts for
  #             price.parquet accumulating additional year=<YYYY> files as
  #             time passes — bump storage_gb once real multi-year FX history
  #             has built up.
  #   requests: 1,500 (FX) + 1,100 (stock) = 2,600
  module.market_data_bucket.aws_s3_bucket.this:
    standard:
      storage_gb: 0.01
      monthly_tier_1_requests: 2600 # PUT/COPY/POST/LIST — FX (1,500) + stock (1,100), both every 6h (offset)
      monthly_tier_2_requests: 20000 # GET — backend reads on demand, not sized from pair/ticker estimates

  # React static site — small, but re-synced (and re-read by every visitor)
  # on every deploy.
  module.frontend_bucket.aws_s3_bucket.this:
    standard:
      storage_gb: 1
      monthly_tier_1_requests: 500 # one `aws s3 sync` per deploy
      monthly_tier_2_requests: 50000 # page loads

  # Backend image. A lifecycle policy caps this repo at the 2 most recently
  # pushed images, so this is ~2x a single image's size, not unbounded.
  module.backend_ecr.aws_ecr_repository.this:
    storage_gb: 2
