[project]
name = "equicast-datafeed"
version = "0.1.0"
description = "Resilient yfinance-backed market data client: retries and rate limiting."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "tenacity>=9.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equicast_datafeed"]

[tool.pytest.ini_options]
testpaths = ["tests"]
