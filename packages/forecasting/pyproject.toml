[project]
name = "equicast-forecasting"
version = "0.1.0"
description = "Forecast future dividend payouts from a symbol's actual dividend history."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "equicast-datafeed",
    "equicast-dividends",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
equicast-forecasting = "equicast_forecasting.cli:main"

[tool.uv.sources]
equicast-datafeed = { workspace = true }
equicast-dividends = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equicast_forecasting"]

[tool.pytest.ini_options]
testpaths = ["tests"]
