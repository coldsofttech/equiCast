[project]
name = "equicast-news"
version = "0.1.0"
description = "Recent news headlines (trailing ~30 days, no historical archive) for any yfinance symbol."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "equicast-datafeed",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv.sources]
equicast-datafeed = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equicast_news"]

[tool.pytest.ini_options]
testpaths = ["tests"]
