# Used for manual dev/workflow_dispatch runs (stock-ingestion.yml's "dev"
# environment) — the production ticker list lives in stocks.prod.yaml and is
# what infra/infracost-usage.yml's cost estimate tracks, since the scheduled
# (cron) trigger always targets production.
#
# Each entry is a plain ticker string, or a {ticker, isin} mapping to
# manually override yfinance's ISIN lookup (e.g. it came back empty, or
# wrong/outdated) — the override always wins over the fetched value. Leave
# entries as plain strings unless an override is actually needed. Example:
#   - ticker: NVDA
#     isin: US67066G1040
tickers:
  - ticker: AAPL
    isin: US0378331005
  - ticker: MSFT
    isin: US5949181045
  - ticker: GOOGL
    isin: US02079K3059
  - ticker: AMZN
    isin: US0231351067
  - ticker: NVDA
    isin: US67066G1040
  - ticker: META
    isin: US30303M1027
  - ticker: TSLA
    isin: US88160R1014
  - ticker: QCOM
    isin: US7475251036
  - ticker: AVGO
    isin: US11135F1012
