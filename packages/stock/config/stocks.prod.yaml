# Used for scheduled (cron) runs and manual "production" workflow_dispatch
# runs. Currently mirrors stocks.dev.yaml; expand independently as needed.
#
# Changing this list changes the market_data_bucket cost estimate (this
# pipeline shares the bucket with equicast-fx). See
# infra/infracost-usage.yml's module.market_data_bucket.aws_s3_bucket.this
# comments (Stock section) for the formula — recompute those lines if this
# list's length changes materially. Per-ticker sizes there: profile.parquet
# ~30KB and metrics.parquet ~20KB (one-time snapshots), plus price.parquet
# ~20KB/year, dividend.parquet ~10KB/year, and events.parquet ~10KB/year
# (accumulating one year=<YYYY> partition per year, projected out to 20
# years of history).
#
# Each entry is a plain ticker string, or a {ticker, isin} mapping to
# manually override yfinance's ISIN lookup (e.g. it came back empty, or
# wrong/outdated) — the override always wins over the fetched value. Leave
# entries as plain strings unless an override is actually needed. Example:
#   - ticker: NVDA
#     isin: US67066G1040
