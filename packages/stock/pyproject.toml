[project]
name = "equicast-stock"
version = "0.1.0"
description = "Stock ticker market data extraction, built on equicast-datafeed."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "equicast-datafeed",
    "equicast-metrics",
    "equicast-dividends",
    "equicast-events",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
equicast-stock = "equicast_stock.cli:main"
equicast-stock-plan = "equicast_stock.plan:main"

[tool.uv.sources]
equicast-datafeed = { workspace = true }
equicast-metrics = { workspace = true }
equicast-dividends = { workspace = true }
equicast-events = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equicast_stock"]

[tool.pytest.ini_options]
testpaths = ["tests"]
