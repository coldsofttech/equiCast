[project]
name = "equicast-benchmark"
version = "0.1.0"
description = "Market index (benchmark) data extraction, built on equicast-datafeed."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "equicast-datafeed",
    "equicast-metrics",
    "equicast-news",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
    "types-PyYAML>=6.0",
]

[project.scripts]
equicast-benchmark = "equicast_benchmark.cli:main"
equicast-benchmark-plan = "equicast_benchmark.plan:main"

[tool.uv.sources]
equicast-datafeed = { workspace = true }
equicast-metrics = { workspace = true }
equicast-news = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equicast_benchmark"]

[tool.pytest.ini_options]
testpaths = ["tests"]
