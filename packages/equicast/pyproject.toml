[project]
name = "equicast"
version = "0.1.0"
description = "Equity market data ingestion, storage, and forecasting toolkit."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "coldsofttech", email = "coldsoft.mail@gmail.com" }]
dependencies = [
    "yfinance>=0.2.40",
    "pandas>=2.2",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equicast"]

[tool.pytest.ini_options]
testpaths = ["tests"]
