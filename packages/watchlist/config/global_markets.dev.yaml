# The "Global Markets" system watchlist's dev membership — used for local
# runs and manual "dev" workflow_dispatch runs. A small (5) subset of
# global_markets.prod.yaml's full list, one or two per asset_class, rather
# than a full mirror — sized in the same spirit as
# MAX_HOLDINGS_FOR_WATCHLIST's own dev value (see
# backend/equicast_api/settings.py) even though this list isn't actually
# capped by that setting — plenty to exercise the pipeline locally without
# waiting on 24 yfinance fetches every run.
#
# See global_markets.prod.yaml's header for the per-`asset_class` shape.
entries:
  - asset_class: future
    key: GOLD
    symbol: "GC=F"
    name: Gold
  - asset_class: future
    key: SILVER
    symbol: "SI=F"
    name: Silver
  - asset_class: fx
    from: EUR
    to: USD
    name: EUR/USD
  - asset_class: fx
    from: GBP
    to: USD
    name: GBP/USD
  - asset_class: benchmark
    key: SP500
    symbol: "^GSPC"
    name: S&P 500
