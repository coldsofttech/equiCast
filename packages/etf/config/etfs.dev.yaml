# Used for manual dev/workflow_dispatch runs (etf-ingestion.yml's "dev"
# environment) — the production ticker list lives in etfs.prod.yaml and is
# what infra/infracost-usage.yml's cost estimate tracks, since the scheduled
# (cron) trigger always targets production.
#
# Each entry is a plain ticker string, or a {ticker, isin} mapping to
# manually override yfinance's ISIN lookup (e.g. it came back empty, or
# wrong/outdated) — the override always wins over the fetched value. Leave
# entries as plain strings unless an override is actually needed. Example:
#   - ticker: VOO
#     isin: US9229083632
tickers:
  - ticker: VOO
    isin: US9229083632
  - ticker: QQQ
    isin: US46090E1038
  - ticker: VTI
    isin: US9229087690
  - ticker: AGG
    isin: US4642872265
  - ticker: GLD
    isin: US78463V1070
