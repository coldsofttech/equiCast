[project]
name = "equicast-core"
version = "0.1.0"
description = "Shared AWS storage clients for equicast (S3 market-data reads via pyarrow, DynamoDB user-profile storage, S3 JSON user-owned data), for any consumer (Django backend, Lambda, scripts)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    # >=1.35.9: AccountsClient's optimistic-concurrency writes need S3
    # conditional-write support (IfMatch/IfNoneMatch on PutObject), added in
    # botocore 1.35.2.
    "boto3>=1.35.9",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[s3,dynamodb]>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equicast_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
