[project]
name = "equicast-core"
version = "0.1.0"
description = "Generic reader for equicast's S3 market-data layout (Parquet via pyarrow), for any consumer (Django backend, Lambda, scripts)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "boto3>=1.34",
    "pyarrow>=17.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "moto[s3]>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equicast_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]
