[project]
name = "equicast-events"
version = "0.1.0"
description = "Generic corporate events (earnings, analyst ratings, stock splits) for any yfinance equity-like symbol (stock ticker or ETF)."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "equicast-datafeed",
    "pandas>=2.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "ruff>=0.6",
    "mypy>=1.11",
]

[tool.uv.sources]
equicast-datafeed = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/equicast_events"]

[tool.pytest.ini_options]
testpaths = ["tests"]
