[tool.uv.workspace]
members = [
    "packages/core",
    "packages/datafeed",
    "packages/metrics",
    "packages/dividends",
    "packages/events",
    "packages/news",
    "packages/forecasting",
    "packages/fx",
    "packages/benchmark",
    "packages/stock",
    "packages/etf",
    "backend",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.ruff.lint.per-file-ignores]
# Trading 212 CSV fixture rows are literal file content — wrapping them
# would misrepresent the data being parsed.
"packages/core/tests/test_imports.py" = ["E501"]

[tool.mypy]
python_version = "3.12"
ignore_missing_imports = true
exclude = ["backend/.*/migrations/"]
