[tool.uv.workspace]
members = [
    "packages/equicast",
    "packages/datafeed",
    "packages/metrics",
    "packages/fx",
    "packages/stock",
    "backend",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
python_version = "3.11"
ignore_missing_imports = true
exclude = ["backend/.*/migrations/"]
