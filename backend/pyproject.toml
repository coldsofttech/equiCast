[project]
name = "equicast-backend"
version = "0.1.0"
description = "Django REST API for equicast."
readme = "README.md"
requires-python = ">=3.11"
dependencies = [
    "django>=5.1",
    "djangorestframework>=3.15",
    "django-cors-headers>=4.4",
    "gunicorn>=23.0",
    "mangum>=0.17",
    "boto3>=1.35.9",
    "pyarrow>=17.0",
    "pyjwt[crypto]>=2.8",
    "equicast-core",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-django>=4.9",
    "moto[s3]>=5.0",
    "ruff>=0.6",
]

[tool.uv.sources]
equicast-core = { workspace = true }

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["equicast_api", "market_data", "identity", "accounts", "pies", "watchlists"]

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "equicast_api.settings"
python_files = ["tests.py", "test_*.py"]
