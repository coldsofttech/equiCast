<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>equiCast</title>
    <!--
      The mobile/compact export from docs/design/README.md's brand
      decisions — a solid gradient badge, so it works as a favicon
      regardless of the page's own light/dark theme. No .ico fallback
      (Safari's the only real holdout on SVG favicons, and degrades to no
      icon rather than a broken one).
    -->
    <link rel="icon" type="image/svg+xml" href="/brand/equicast-mark.svg" />
    <!--
      Runs synchronously, before any stylesheet paints, so `data-theme` is
      already correct on first frame — same reasoning as Resource Planner's
      theme-init.min.js. tokens.css only defines `:root` (light) and
      `[data-theme="dark"]`, no `prefers-color-scheme` fallback, because
      this script guarantees the attribute is never absent.
    -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem("ec-theme");
          var theme =
            stored ||
            (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light");
          document.documentElement.setAttribute("data-theme", theme);
        } catch (err) {
          document.documentElement.setAttribute("data-theme", "light");
        }
      })();
    </script>
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap"
    />
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
