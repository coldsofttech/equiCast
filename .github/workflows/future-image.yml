name: Build Future Image

on:
  push:
    branches: [main]
    paths:
      - "packages/datafeed/**"
      - "packages/future/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/future-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push equicast-future (private)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/future/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/equicast-future:latest
            ghcr.io/${{ github.repository_owner }}/equicast-future:${{ github.sha }}
