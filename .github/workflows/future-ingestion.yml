name: Future Ingestion

on:
  # Once daily, Monday-Friday only, at 23:15 UTC — 15 minutes after
  # benchmark-ingestion.yml's "0 23 * * 1-5" (itself 15 minutes after
  # stock-ingestion.yml's 22:45 UTC, 30 minutes after fx-ingestion.yml's
  # 22:00 UTC, and 45 minutes after etf-ingestion.yml's 22:15 UTC), so none
  # of the five ever overlap even if one takes longer than expected.
  # Futures track major commodity/currency-adjacent contracts rather than
  # a listed exchange's own close, but the same "after both US and UK
  # markets close" reasoning fx-ingestion.yml uses still applies — most of
  # the CME/ICE/NYMEX contracts configured here settle close to that
  # window too. No Saturday entry — like equicast-benchmark,
  # equicast-future has no forecasting step (futures pay no dividends),
  # so there's nothing for a weekly Saturday run to do here.
  schedule:
    - cron: "15 23 * * 1-5"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run against"
        type: choice
        options:
          - dev
          - production
        default: dev
      full_load:
        description: "Full historical load (all years) instead of current year only"
        type: boolean
        default: false
      chunk_size:
        description: "Target futures per parallel chunk"
        default: "300"
      tickers:
        description: "Optional: restrict this run to specific futures, separated by ; (e.g. GOLD;CRUDE_OIL_WTI). Leave blank to run against every configured future."
        default: ""
      max_workers:
        description: "Concurrent fetches within each container"
        default: "5"
      max_calls:
        description: "Max yfinance calls per period-seconds, per container"
        default: "5"
      period_seconds:
        description: "Rate-limit window in seconds, per container"
        default: "1.0"

permissions:
  id-token: write
  packages: read
  contents: read

jobs:
  # Splits the configured futures into chunks so the ingest job below can
  # process them across parallel matrix legs instead of one long-running
  # container. GitHub caps a workflow's matrix at 256 jobs, so
  # equicast-future-plan grows the chunk size (rather than dropping
  # futures) if the full list would otherwise need more chunks than that.
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      has_chunks: ${{ steps.plan.outputs.has_chunks }}
      environment: ${{ steps.env.outputs.environment }}
      bucket: ${{ steps.env.outputs.bucket }}
      targeted: ${{ steps.env.outputs.targeted }}
      image_tag: ${{ steps.env.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      # Scheduled runs always target production, regardless of the
      # workflow_dispatch default below — there's no input to read on a
      # cron trigger. Manual runs pick dev/production via the "environment"
      # input. Resolved once here, before the chunk computation below, so
      # every chunk both reads the right config file (futures.dev.yaml
      # vs. futures.prod.yaml) and uploads to the same bucket, and a
      # missing variable fails fast, before any container spends time
      # fetching data.
      - name: Resolve target environment, bucket, and config
        id: env
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ENVIRONMENT=production
          else
            ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          fi

          if [ "$ENVIRONMENT" = "production" ]; then
            BUCKET="${{ vars.MARKET_DATA_BUCKET_PROD }}"
            CONFIG="config/futures.prod.yaml"
          else
            BUCKET="${{ vars.MARKET_DATA_BUCKET_DEV }}"
            CONFIG="config/futures.dev.yaml"
          fi

          if [ -z "$BUCKET" ]; then
            echo "::error::MARKET_DATA_BUCKET_$(echo "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]') repo variable is not set"
            exit 1
          fi

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"
          # Whether this run is restricted to a "tickers" subset — the
          # build-catalog job below reads this to merge into the existing
          # catalog instead of replacing it outright, since a targeted run's
          # output only ever covers part of the full future list.
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            echo "targeted=true" >> "$GITHUB_OUTPUT"
          else
            echo "targeted=false" >> "$GITHUB_OUTPUT"
          fi

          # equicast-support#185: dev/vX.Y branches (see images.yml's
          # build-push-image composite action) push a :dev tag rather than
          # overwriting :latest - this run pulls whichever one matches the
          # branch it's actually running from, so a dev/v1.1 run tests
          # dev/v1.1's own image rather than silently falling back to
          # main's.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute future chunks
        id: plan
        working-directory: packages/future
        run: |
          CHUNKS=$(uv run equicast-future-plan \
            --config "${{ steps.env.outputs.config }}" \
            --chunk-size "${{ github.event.inputs.chunk_size || '300' }}" \
            --max-chunks 256 \
            --tickers "${{ github.event.inputs.tickers || '' }}")
          echo "chunks=$CHUNKS" >> "$GITHUB_OUTPUT"
          if [ "$CHUNKS" = "[]" ]; then
            echo "has_chunks=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_chunks=true" >> "$GITHUB_OUTPUT"
          fi

  ingest:
    needs: plan
    if: needs.plan.outputs.has_chunks == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Caps how many legs run at once, independent of the matrix size (up to
      # 256 legs) computed by the plan job above. Tune to your account's
      # concurrent-job limit and to how hard you want to hit Yahoo Finance at
      # once (each leg runs on a separate runner, so a separate source IP).
      max-parallel: 20
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      # Needed to resolve `uses: ./.github/actions/configure-aws` below - a
      # local composite action can't be resolved without the repo checked
      # out first (see build-push-image for the same constraint). Not
      # needed for anything else in this job - the docker/AWS CLI steps
      # below don't read repo source.
      - uses: actions/checkout@v7

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull equicast-future image
        run: docker pull ghcr.io/${{ github.repository_owner }}/equicast-future:${{ needs.plan.outputs.image_tag }}

      - name: Extract this chunk's future profiles and prices
        run: |
          mkdir -p output
          docker run --rm \
            -v "${PWD}/output:/output" \
            ghcr.io/${{ github.repository_owner }}/equicast-future:${{ needs.plan.outputs.image_tag }} \
            --futures-json '${{ toJson(matrix.chunk) }}' \
            --out /output \
            ${{ github.event.inputs.full_load == 'true' && '--full-load' || '' }} \
            --max-workers "${{ github.event.inputs.max_workers || '5' }}" \
            --max-calls "${{ github.event.inputs.max_calls || '5' }}" \
            --period-seconds "${{ github.event.inputs.period_seconds || '1.0' }}"

      - name: Configure AWS credentials via OIDC
        uses: ./.github/actions/configure-aws
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Moved out of output/ before the S3 upload below so this chunk's
      # failures.json (if any - see
      # equicast_future.writer.write_failures_manifest, written whenever a
      # future's task fails; GitHub issue equicast-support#145) never lands
      # in S3 alongside the Hive-partitioned future=*/... data. Renamed
      # with this leg's matrix index so multiple chunks' failures.json -
      # each written to the same relative path inside its own chunk's
      # output/ - don't collide once report-status downloads every chunk's
      # artifact into one shared directory (see merge_failures.py).
      - name: Set aside this chunk's failures manifest, if any
        run: |
          mkdir -p chunk-failures
          if [ -f output/failures.json ]; then
            mv output/failures.json "chunk-failures/failures-${{ strategy.job-index }}.json"
          fi

      - name: Upload future profiles and prices to S3
        run: aws s3 cp output/ "s3://${{ needs.plan.outputs.bucket }}/" --recursive

      # Moved under output/ only now, after the S3 upload above, so both
      # patterns below share output/ as their common root. upload-artifact
      # strips whatever root the given patterns share before archiving -
      # with output/future=*/profile.parquet and
      # chunk-failures/failures-*.json sharing no common directory, it fell
      # back to the repo root and kept the leading "output/" on the profile
      # path but not on chunk-failures, so build-catalog's download (which
      # re-extracts into output/) landed profiles one directory too deep
      # (output/output/future=*/...) and its glob for
      # output/future=*/profile.parquet silently matched nothing - an empty
      # catalog with no error anywhere.
      - name: Move this chunk's failures manifest under output/ for the artifact upload
        run: mv chunk-failures output/chunk-failures

      # Feeds build-catalog below — that job needs every chunk's
      # profile.parquet (and, since equicast_core.catalog folds cagr_1y/
      # change_1w_pct/change_1m_pct into the catalog too, each future's
      # sibling metrics.parquet) in one place to build a complete catalog,
      # and a matrix leg only ever sees its own chunk. Publishing
      # metrics.parquet here — rather than having build-catalog read it
      # back from S3 per future — keeps that job to the one S3 read per
      # asset class it already does (the catalog itself), no per-future S3
      # calls added. Short retention: this artifact only exists to hand off
      # within this run, not for later reference (see equicast_core.
      # catalog's module docstring for why the catalog can't be built
      # inside this per-chunk job at all). Also carries this chunk's
      # failures-<index>.json (see above), if any - report-status's
      # failures merge step below needs every chunk's, the same way
      # build-catalog needs every chunk's profile.parquet.
      - name: Publish this chunk's profiles and metrics for the catalog build
        uses: actions/upload-artifact@v7
        with:
          name: future-profiles-${{ strategy.job-index }}
          path: |
            output/future=*/profile.parquet
            output/future=*/metrics.parquet
            output/chunk-failures/failures-*.json
          retention-days: 1

  # Rebuilds catalog/future.parquet (see equicast_core.catalog) from every
  # chunk's freshly-fetched profiles and metrics, merged back together here
  # since no single ingest leg above ever sees the full future list. Needs
  # no new S3 permission beyond what ingest already has (s3:PutObject) — it
  # reads the profiles/metrics locally, from the downloaded artifacts, not
  # back from S3.
  #
  # A targeted run (plan.outputs.targeted, from the "tickers" input) only
  # ever fetched a subset of the full future list, so its build-catalog
  # step below passes --merge instead of letting equicast-core-build-catalog
  # replace the whole catalog with just that subset.
  build-catalog:
    needs: [plan, ingest]
    if: needs.plan.outputs.has_chunks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Download every chunk's profiles and metrics
        uses: actions/download-artifact@v8
        with:
          pattern: future-profiles-*
          path: output
          merge-multiple: true

      - name: Configure AWS credentials via OIDC
        uses: ./.github/actions/configure-aws
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build and upload the future search catalog
        working-directory: packages/core
        run: |
          uv run equicast-core-build-catalog \
            --asset-class future \
            --output-dir "${{ github.workspace }}/output" \
            --bucket "${{ needs.plan.outputs.bucket }}" \
            ${{ needs.plan.outputs.targeted == 'true' && '--merge' || '' }}

  # GitHub issue equicast-support#145: previously a failed run here was only
  # visible via the red X on the Actions tab. Reports pipeline health to
  # equicast-support (reusing sync-missing-isin-issue.sh's
  # SUPPORT_ISSUE_TOKEN/SUPPORT_REPO pattern, see stock-ingestion.yml/
  # etf-ingestion.yml) - a single rolling issue for overall job/infra health
  # (see sync-pipeline-failure-issue.sh), plus one native sub-issue per
  # future whose own data extraction is currently failing (see
  # sync-pipeline-failure-subissues.sh; a per-future failure no longer
  # fails the whole chunk - see equicast_future.cli.run()). Runs regardless
  # of whether plan/ingest/build-catalog succeeded, failed, or were
  # skipped, so it can both report a new failure and auto-close a
  # previously-reported one once a run succeeds again.
  report-status:
    needs: [plan, ingest, build-catalog]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Sync pipeline status
        uses: ./.github/actions/sync-pipeline-status
        with:
          pipeline-label: Future
          artifact-prefix: future-profiles-
          plan-result: ${{ needs.plan.result }}
          ingest-result: ${{ needs.ingest.result }}
          build-catalog-result: ${{ needs.build-catalog.result }}
          targeted: ${{ needs.plan.outputs.targeted }}
          support-repo: ${{ vars.SUPPORT_REPO }}
          support-issue-token: ${{ secrets.SUPPORT_ISSUE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # GitHub issue equicast-support#169: future-profiles-*'s per-chunk
  # profile.parquet is only ever needed to hand off to build-catalog above
  # (and, alongside it, each chunk's failures-<index>.json to report-status
  # - see that job's own comments) within this one run - not for later
  # reference. Deletes it once both are done rather than relying on
  # retention-days: 1 to eventually reclaim it, so a run's artifacts list
  # doesn't sit around holding already-consumed per-chunk data.
  # needs.build-catalog.result == 'success' (guarded with always() so
  # report-status's own result doesn't matter here) rather than the
  # default "both needs succeeded" - the catalog must have actually built
  # and pushed to S3 first, matching the issue's own wording, but
  # report-status runs via if: always() and can legitimately end in any
  # state once it's had its chance to read the artifacts.
  cleanup-profile-artifacts:
    needs: [build-catalog, report-status]
    if: always() && needs.build-catalog.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Needed to resolve `uses: ./.github/actions/cleanup-artifacts` below
      # - see cleanup-artifacts's own header comment for why.
      - uses: actions/checkout@v7

      - name: Delete per-chunk profile artifacts
        uses: ./.github/actions/cleanup-artifacts
        with:
          artifact-prefix: future-profiles-
          github-token: ${{ secrets.GITHUB_TOKEN }}
