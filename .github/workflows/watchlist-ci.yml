name: Watchlist Packages CI

on:
  push:
    branches: [main]
    paths:
      - "packages/datafeed/**"
      - "packages/fx/**"
      - "packages/benchmark/**"
      - "packages/future/**"
      - "packages/watchlist/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/watchlist-ci.yml"
  pull_request:
    paths:
      - "packages/datafeed/**"
      - "packages/fx/**"
      - "packages/benchmark/**"
      - "packages/future/**"
      - "packages/watchlist/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/watchlist-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --extra dev

      - name: Lint
        run: uv run ruff check packages/datafeed/ packages/fx/ packages/benchmark/ packages/future/ packages/watchlist/

      - name: Type check equicast-datafeed
        working-directory: packages/datafeed
        run: uv run mypy src/

      - name: Type check equicast-fx
        working-directory: packages/fx
        run: uv run mypy src/

      - name: Type check equicast-benchmark
        working-directory: packages/benchmark
        run: uv run mypy src/

      - name: Type check equicast-future
        working-directory: packages/future
        run: uv run mypy src/

      - name: Type check equicast-watchlist
        working-directory: packages/watchlist
        run: uv run mypy src/

      - name: Test equicast-datafeed
        working-directory: packages/datafeed
        run: uv run pytest

      - name: Test equicast-fx
        working-directory: packages/fx
        run: uv run pytest

      - name: Test equicast-benchmark
        working-directory: packages/benchmark
        run: uv run pytest

      - name: Test equicast-future
        working-directory: packages/future
        run: uv run pytest

      - name: Test equicast-watchlist
        working-directory: packages/watchlist
        run: uv run pytest
