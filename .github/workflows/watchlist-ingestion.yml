name: Watchlist Ingestion

on:
  # Once weekly, Saturday only — unlike fx/stock/etf/benchmark/future-
  # ingestion.yml (all Monday-Friday), a system watchlist is a snapshot
  # meant to be refreshed periodically, not a daily feed, and Saturday
  # gives it a full week's worth of trading (through Friday's close) to
  # summarize. equicast-watchlist fetches straight from yfinance itself
  # (see packages/watchlist/README.md) rather than reading any of the
  # other five pipelines' S3 output, so it has no ordering dependency on
  # them and no reason to run on their Monday-Friday schedule.
  schedule:
    - cron: "0 6 * * 6"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run against"
        type: choice
        options:
          - dev
          - production
        default: dev
      max_workers:
        description: "Concurrent fetches within each container"
        default: "5"
      max_calls:
        description: "Max yfinance calls per period-seconds, per container"
        default: "5"
      period_seconds:
        description: "Rate-limit window in seconds, per container"
        default: "1.0"

permissions:
  id-token: write
  packages: read
  contents: read

jobs:
  # `ingest`: one step per system watchlist that's built straight from a
  # config file (today just Global Markets), plus the rank/movers steps
  # that build Top Winners/Top Losers from the stock/ETF universe instead
  # (see packages/watchlist/src/equicast_watchlist/movers.py). There's no
  # "plan"/matrix-chunk job like the other five pipelines: a system
  # watchlist's entry list is small enough to fetch in a single container
  # run, and no "build-catalog" job either, since equicast-watchlist
  # doesn't produce (or read) a catalog/*.parquet file at all. (Additional
  # config-driven system watchlists land here later as their own "Build
  # <name> watchlist entries" step, each pointing at its own config file —
  # no new job needed, no changes to the steps already here.)
  #
  # `report-status`/`cleanup-failure-artifacts` give this pipeline the
  # same equicast-support#145/#169 failure-reporting resilience every
  # other pipeline already has, with `ingest`'s own result standing in for
  # all three of plan/ingest/build-catalog - this pipeline has neither of
  # the other two jobs, so there's nothing else to fold in.
  ingest:
    runs-on: ubuntu-latest
    outputs:
      bucket: ${{ steps.env.outputs.bucket }}
    steps:
      - uses: actions/checkout@v7

      - name: Resolve target environment, bucket, and config
        id: env
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ENVIRONMENT=production
          else
            ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          fi

          if [ "$ENVIRONMENT" = "production" ]; then
            BUCKET="${{ vars.MARKET_DATA_BUCKET_PROD }}"
            CONFIG="config/global_markets.prod.yaml"
            STOCK_CONFIG="../stock/config/stocks.prod.yaml"
            ETF_CONFIG="../etf/config/etfs.prod.yaml"
          else
            BUCKET="${{ vars.MARKET_DATA_BUCKET_DEV }}"
            CONFIG="config/global_markets.dev.yaml"
            STOCK_CONFIG="../stock/config/stocks.dev.yaml"
            ETF_CONFIG="../etf/config/etfs.dev.yaml"
          fi

          if [ -z "$BUCKET" ]; then
            echo "::error::MARKET_DATA_BUCKET_$(echo "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]') repo variable is not set"
            exit 1
          fi

          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "global_markets_config=$CONFIG" >> "$GITHUB_OUTPUT"
          echo "stock_config=$STOCK_CONFIG" >> "$GITHUB_OUTPUT"
          echo "etf_config=$ETF_CONFIG" >> "$GITHUB_OUTPUT"

          # equicast-support#185: dev/vX.Y branches (see images.yml's
          # build-push-image composite action) push a :dev tag rather than
          # overwriting :latest - this run pulls whichever one matches the
          # branch it's actually running from, so a dev/v1.1 run tests
          # dev/v1.1's own image rather than silently falling back to
          # main's.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull equicast-watchlist image
        run: docker pull ghcr.io/${{ github.repository_owner }}/equicast-watchlist:${{ steps.env.outputs.image_tag }}

      # --- Global Markets ---
      - name: Build Global Markets watchlist entries
        run: |
          mkdir -p output
          docker run --rm \
            -v "${PWD}/output:/output" \
            ghcr.io/${{ github.repository_owner }}/equicast-watchlist:${{ steps.env.outputs.image_tag }} \
            --watchlist-key GLOBAL_MARKETS \
            --config "${{ steps.env.outputs.global_markets_config }}" \
            --out /output \
            --max-workers "${{ github.event.inputs.max_workers || '5' }}" \
            --max-calls "${{ github.event.inputs.max_calls || '5' }}" \
            --period-seconds "${{ github.event.inputs.period_seconds || '1.0' }}"

      # failures.json (if any - see
      # equicast_watchlist.writer.write_failures_manifest, written
      # whenever an entry's fetch fails; GitHub issue equicast-support#145)
      # is set aside under a step-specific name immediately after each
      # docker run below, before the next run's own /output (or /rankings)
      # mount can overwrite it — unlike the other five pipelines' matrix
      # legs, every step here shares this same job's filesystem, so
      # Global Markets/Top Winners/Top Losers would otherwise all
      # clobber the same output/failures.json in turn.
      - name: Set aside Global Markets' failures manifest, if any
        run: |
          mkdir -p chunk-failures
          if [ -f output/failures.json ]; then
            mv output/failures.json chunk-failures/failures-global_markets.json
          fi

      # --- Top Winners / Top Losers ---
      # Step 1 (independent of winners/losers — see
      # packages/watchlist/src/equicast_watchlist/movers.py): every stock/ETF
      # ticker's trailing 1-year CAGR, computed once and written to
      # ./rankings/rankings.json — a plain JSON file, not a watchlist itself,
      # so it's kept out of ./output (never uploaded to S3 below).
      - name: Compute stock/ETF 1-year CAGR rankings
        run: |
          mkdir -p rankings
          docker run --rm \
            -v "${PWD}/rankings:/rankings" \
            ghcr.io/${{ github.repository_owner }}/equicast-watchlist:${{ steps.env.outputs.image_tag }} \
            --mode rank \
            --stock-config "${{ steps.env.outputs.stock_config }}" \
            --etf-config "${{ steps.env.outputs.etf_config }}" \
            --out /rankings \
            --max-workers "${{ github.event.inputs.max_workers || '5' }}" \
            --max-calls "${{ github.event.inputs.max_calls || '5' }}" \
            --period-seconds "${{ github.event.inputs.period_seconds || '1.0' }}"

      - name: Set aside the CAGR ranking's failures manifest, if any
        run: |
          if [ -f rankings/failures.json ]; then
            mv rankings/failures.json chunk-failures/failures-rank.json
          fi

      # Steps 2 and 3: the rankings' top and bottom
      # MAX_HOLDINGS_FOR_WATCHLIST tickers (same repo variable
      # backend/watchlists/views.py's HoldingsClient reads for a custom
      # watchlist's own holdings cap), each built into full watchlist
      # entries the same way Global Markets' entries are above.
      - name: Build Top Winners watchlist entries
        run: |
          docker run --rm \
            -v "${PWD}/output:/output" \
            -v "${PWD}/rankings:/rankings" \
            ghcr.io/${{ github.repository_owner }}/equicast-watchlist:${{ steps.env.outputs.image_tag }} \
            --mode movers \
            --watchlist-key TOP_WINNERS \
            --direction winners \
            --rankings /rankings/rankings.json \
            --limit "${{ vars.MAX_HOLDINGS_FOR_WATCHLIST || '50' }}" \
            --out /output \
            --max-workers "${{ github.event.inputs.max_workers || '5' }}" \
            --max-calls "${{ github.event.inputs.max_calls || '5' }}" \
            --period-seconds "${{ github.event.inputs.period_seconds || '1.0' }}"

      - name: Set aside Top Winners' failures manifest, if any
        run: |
          if [ -f output/failures.json ]; then
            mv output/failures.json chunk-failures/failures-top_winners.json
          fi

      - name: Build Top Losers watchlist entries
        run: |
          docker run --rm \
            -v "${PWD}/output:/output" \
            -v "${PWD}/rankings:/rankings" \
            ghcr.io/${{ github.repository_owner }}/equicast-watchlist:${{ steps.env.outputs.image_tag }} \
            --mode movers \
            --watchlist-key TOP_LOSERS \
            --direction losers \
            --rankings /rankings/rankings.json \
            --limit "${{ vars.MAX_HOLDINGS_FOR_WATCHLIST || '50' }}" \
            --out /output \
            --max-workers "${{ github.event.inputs.max_workers || '5' }}" \
            --max-calls "${{ github.event.inputs.max_calls || '5' }}" \
            --period-seconds "${{ github.event.inputs.period_seconds || '1.0' }}"

      - name: Set aside Top Losers' failures manifest, if any
        run: |
          if [ -f output/failures.json ]; then
            mv output/failures.json chunk-failures/failures-top_losers.json
          fi

      - name: Configure AWS credentials via OIDC
        uses: ./.github/actions/configure-aws
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Upload watchlist entries to S3
        run: aws s3 cp output/ "s3://${{ steps.env.outputs.bucket }}/" --recursive

      - name: Move this run's failures manifests under output/ for the artifact upload
        run: mv chunk-failures output/chunk-failures

      # Feeds report-status below — same failures-manifest handoff every
      # other pipeline's ingest job does, just with no profile.parquet
      # glob alongside it (there's no catalog build here to feed), and up
      # to four manifests (Global Markets/rank/Top Winners/Top Losers)
      # instead of one per matrix leg. Short retention: this artifact only
      # exists to hand off within this run, not for later reference.
      - name: Publish this run's failures manifests for report-status
        uses: actions/upload-artifact@v7
        with:
          name: watchlist-failures-0
          path: output/chunk-failures/failures-*.json
          retention-days: 1
          if-no-files-found: ignore

  # GitHub issue equicast-support#145: previously a failed run here was only
  # visible via the red X on the Actions tab. Reports pipeline health to
  # equicast-support the same way as the other five pipelines
  # (sync-pipeline-status), just with `ingest`'s own result standing in for
  # all three of plan/ingest/build-catalog - this pipeline has neither of
  # the other two jobs (see `ingest`'s own comment for why), so there's
  # nothing else to fold in. `targeted` is always 'false' - unlike
  # stock/etf/fx/benchmark/future, there's no "tickers" subset input here:
  # every run always builds the watchlist's complete, fixed entry list.
  report-status:
    needs: [ingest]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v7

      - name: Sync pipeline status
        uses: ./.github/actions/sync-pipeline-status
        with:
          pipeline-label: Watchlist
          artifact-prefix: watchlist-failures-
          plan-result: ${{ needs.ingest.result }}
          ingest-result: ${{ needs.ingest.result }}
          build-catalog-result: ${{ needs.ingest.result }}
          targeted: "false"
          support-repo: ${{ vars.SUPPORT_REPO }}
          support-issue-token: ${{ secrets.SUPPORT_ISSUE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # GitHub issue equicast-support#169: watchlist-failures-0 is only ever
  # needed to hand off to report-status above within this one run - not
  # for later reference. Deletes it once report-status has had its chance
  # to read it, rather than relying on retention-days: 1 to eventually
  # reclaim it, so a run's artifacts list doesn't sit around holding
  # already-consumed data. Gated on `ingest`'s own success (there's no
  # build-catalog job here to gate on instead) - if `ingest` never
  # completed, there's no artifact to clean up.
  cleanup-failure-artifacts:
    needs: [ingest, report-status]
    if: always() && needs.ingest.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      - uses: actions/checkout@v7

      - name: Delete this run's failures artifact
        uses: ./.github/actions/cleanup-artifacts
        with:
          artifact-prefix: watchlist-failures-
          github-token: ${{ secrets.GITHUB_TOKEN }}
