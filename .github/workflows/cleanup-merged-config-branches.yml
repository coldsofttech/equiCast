name: Cleanup Merged Config Branches

# Deletes a config/<asset_class>-<environment>-<action>-<key>-<run_id>
# branch (opened by manage-config-fix.yml) once its PR merges, so these
# accumulate as auto-created noise rather than lingering after they've
# served their purpose. Scoped to config/* by name rather than flipping
# the repo-wide "Automatically delete head branches" setting, so other
# branches are never touched regardless of how their PR is merged. Mirrors
# cleanup-merged-isin-branches.yml, kept as its own workflow per scenario
# (see docs/github-issue-automations.md).
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'config/')
    runs-on: ubuntu-latest
    steps:
      - name: Delete the merged branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH"
