name: Cleanup Merged ISIN Branches

# Deletes an isin/<TICKER> branch (opened by missing-isin-fix.yml) once its
# PR merges, so these accumulate as auto-created noise rather than lingering
# after they've served their purpose. Scoped to isin/* by name rather than
# flipping the repo-wide "Automatically delete head branches" setting, so
# other branches are never touched regardless of how their PR is merged.
on:
  pull_request:
    types: [closed]

permissions:
  contents: write

jobs:
  delete-branch:
    if: github.event.pull_request.merged == true && startsWith(github.event.pull_request.head.ref, 'isin/')
    runs-on: ubuntu-latest
    steps:
      - name: Delete the merged branch
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH: ${{ github.event.pull_request.head.ref }}
        run: gh api -X DELETE "repos/${{ github.repository }}/git/refs/heads/$BRANCH"
