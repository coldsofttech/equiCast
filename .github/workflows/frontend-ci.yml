name: Frontend CI

on:
  push:
    # dev/** covers the dev/vX.Y integration branches for a release about
    # to ship (equicast-support#185) - the same CI that runs on main.
    branches: [main, "dev/**"]
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"
  # Lets a `main` run be triggered manually (Actions tab -> Run workflow,
  # or `gh workflow run "Frontend CI" --ref main`) when a merge to `main`
  # didn't touch frontend/** — e.g. an infra-only PR — so deploy.yml's
  # workflow_run trigger still has something to chain off of.
  workflow_dispatch:
  pull_request:
    paths:
      - "frontend/**"
      - ".github/workflows/frontend-ci.yml"

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json

      - run: npm ci
      - run: npm run lint
      - run: npm run test -- --run
      - run: npm run build
