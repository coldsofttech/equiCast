name: Backend CI

on:
  push:
    # dev/** covers the dev/vX.Y integration branches for a release about
    # to ship (equicast-support#185) - the same CI that runs on main.
    branches: [main, "dev/**"]
    paths:
      - "packages/core/**"
      - "backend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-ci.yml"
      - ".github/actions/python-package-ci/**"
  # Lets a `main` run be triggered manually (Actions tab -> Run workflow,
  # or `gh workflow run "Backend CI" --ref main`) when a merge to `main`
  # didn't touch any of the paths above — e.g. an infra-only PR — so
  # deploy.yml's workflow_run trigger still has something to chain off of.
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/core/**"
      - "backend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-ci.yml"
      - ".github/actions/python-package-ci/**"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # lint-path is left unset on both calls below - this workflow lints
      # the whole repo in one `ruff check .` (it's the only workflow that
      # also covers files outside packages/ and backend/, e.g.
      # .github/scripts/*.py), rather than one per-package ruff check like
      # packages-ci.yml's matrix.
      - name: Type check and test equicast-core
        uses: ./.github/actions/python-package-ci
        with:
          working-directory: packages/core

      - name: Lint
        run: uv run ruff check .

      - name: Type check and test Django backend
        uses: ./.github/actions/python-package-ci
        with:
          working-directory: backend
          mypy-target: '.'
          mypy-args: '--ignore-missing-imports'
