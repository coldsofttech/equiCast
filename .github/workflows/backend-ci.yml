name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "packages/equicast/**"
      - "backend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-ci.yml"
  pull_request:
    paths:
      - "packages/equicast/**"
      - "backend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-ci.yml"

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check equicast core
        working-directory: packages/equicast
        run: uv run mypy src/

      - name: Type check Django backend
        working-directory: backend
        run: uv run mypy . --ignore-missing-imports

      - name: Test equicast core
        working-directory: packages/equicast
        run: uv run pytest

      - name: Test Django backend
        working-directory: backend
        run: uv run pytest
