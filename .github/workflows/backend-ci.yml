name: Backend CI

on:
  push:
    branches: [main]
    paths:
      - "packages/core/**"
      - "backend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-ci.yml"
  # Lets a `main` run be triggered manually (Actions tab -> Run workflow,
  # or `gh workflow run "Backend CI" --ref main`) when a merge to `main`
  # didn't touch any of the paths above — e.g. an infra-only PR — so
  # deploy.yml's workflow_run trigger still has something to chain off of.
  workflow_dispatch:
  pull_request:
    paths:
      - "packages/core/**"
      - "backend/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/backend-ci.yml"

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Install dependencies
        run: uv sync --all-packages --extra dev

      - name: Lint
        run: uv run ruff check .

      - name: Type check equicast-core
        working-directory: packages/core
        run: uv run mypy src/

      - name: Type check Django backend
        working-directory: backend
        run: uv run mypy . --ignore-missing-imports

      - name: Test equicast-core
        working-directory: packages/core
        run: uv run pytest

      - name: Test Django backend
        working-directory: backend
        run: uv run pytest
