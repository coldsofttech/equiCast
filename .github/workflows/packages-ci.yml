name: Packages CI

# Consolidates what used to be four workflows (stock-ci.yml, etf-ci.yml,
# fx-ci.yml, benchmark-ci.yml - see GitHub issue equicast-support#2) into
# one matrix job, one entry per unique package directory rather than one
# per asset class - the old per-asset-class shape re-tested every shared
# dependency package (equicast-datafeed/metrics/dividends/events) once
# per workflow that happened to depend on it, up to 4x over on a single
# datafeed change. Lint/type-check/test now run exactly once per package,
# gated by whether that package's own files (or the shared lockfile/
# composite action/this workflow) actually changed - see the `changes`
# job below. The lint/type-check/test steps themselves live in the
# .github/actions/python-package-ci composite action (equicast-support#188,
# follow-up to equicast-support#151's workflow-generalisation proposal),
# also reused by backend-ci.yml for packages/core and backend/.
#
# packages/core is tested inside backend-ci.yml (it's the Django backend's
# dependency, not an asset-class pipeline's) and packages/forecasting
# stays untested for now (equicast-support#147) - both deliberately kept
# out of scope here.
on:
  push:
    # dev/** covers the dev/vX.Y integration branches for a release about
    # to ship (equicast-support#185) - the same CI that runs on main.
    branches: [main, "dev/**"]
    paths:
      - "packages/datafeed/**"
      - "packages/metrics/**"
      - "packages/dividends/**"
      - "packages/events/**"
      - "packages/stock/**"
      - "packages/etf/**"
      - "packages/fx/**"
      - "packages/benchmark/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/packages-ci.yml"
      - ".github/actions/python-package-ci/**"
  pull_request:
    paths:
      - "packages/datafeed/**"
      - "packages/metrics/**"
      - "packages/dividends/**"
      - "packages/events/**"
      - "packages/stock/**"
      - "packages/etf/**"
      - "packages/fx/**"
      - "packages/benchmark/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/packages-ci.yml"
      - ".github/actions/python-package-ci/**"

permissions:
  contents: read

jobs:
  # One boolean output per package - each true only when that package's
  # own directory (or the shared lockfile/composite action/this workflow
  # file) changed in this push/PR, so the test matrix below only runs the
  # package(s) actually affected instead of every package on any relevant
  # change.
  changes:
    runs-on: ubuntu-latest
    outputs:
      datafeed: ${{ steps.filter.outputs.datafeed }}
      metrics: ${{ steps.filter.outputs.metrics }}
      dividends: ${{ steps.filter.outputs.dividends }}
      events: ${{ steps.filter.outputs.events }}
      stock: ${{ steps.filter.outputs.stock }}
      etf: ${{ steps.filter.outputs.etf }}
      fx: ${{ steps.filter.outputs.fx }}
      benchmark: ${{ steps.filter.outputs.benchmark }}
    steps:
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            root: &root
              - "pyproject.toml"
              - "uv.lock"
              - ".github/workflows/packages-ci.yml"
              - ".github/actions/python-package-ci/**"
            datafeed:
              - *root
              - "packages/datafeed/**"
            metrics:
              - *root
              - "packages/metrics/**"
            dividends:
              - *root
              - "packages/dividends/**"
            events:
              - *root
              - "packages/events/**"
            stock:
              - *root
              - "packages/stock/**"
            etf:
              - *root
              - "packages/etf/**"
            fx:
              - *root
              - "packages/fx/**"
            benchmark:
              - *root
              - "packages/benchmark/**"

  test:
    needs: [changes]
    if: needs.changes.outputs[matrix.name] == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        name: [datafeed, metrics, dividends, events, stock, etf, fx, benchmark]
    steps:
      - uses: actions/checkout@v4

      - name: Lint, type-check, and test equicast-${{ matrix.name }}
        uses: ./.github/actions/python-package-ci
        with:
          working-directory: packages/${{ matrix.name }}
          lint-path: packages/${{ matrix.name }}/
