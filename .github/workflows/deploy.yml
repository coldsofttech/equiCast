name: Deploy

on:
  workflow_run:
    workflows: ["Backend CI", "Frontend CI"]
    branches: [main]
    types: [completed]

# Baseline permissions; the active jobs below all declare their own more
# specific per-job permissions (id-token, contents), which take precedence.
permissions:
  contents: read

jobs:
  # Builds the zip once so its real size is known before anyone approves a
  # spend, and hands that exact artifact to both deploy-backend-dev and (by
  # promoting the same S3 object version, not rebuilding) deploy-backend-prod.
  build-backend:
    if: github.event.workflow_run.name == 'Backend CI' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Build Lambda deployment package
        run: bash backend/scripts/build_lambda_package.sh

      - name: Record size in job summary
        run: |
          {
            echo "### Backend Lambda package"
            echo ""
            echo "See the \"Build Lambda deployment package\" step's log above for"
            echo "the exact unzipped/zip sizes (unzipped is checked against"
            echo "Lambda's 250MB deployment package limit)."
          } >> "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v4
        with:
          name: backend-lambda-package
          path: backend/lambda_package.zip
          retention-days: 1

  # Gated behind the "development" GitHub Environment's required reviewers
  # (Settings -> Environments -> development) — the same environment
  # terraform.yml's apply-dev uses, so a required reviewer must approve
  # before anything (infra or backend code) actually deploys to dev. Kept
  # deliberately un-automatic: an unreviewed PR merge shouldn't be able to
  # spike AWS cost in dev on its own. Requires infra/main.tf's
  # backend_lambda module to have already been applied at least once — same
  # class of bootstrap dependency the old ECR flow had (pushing an image
  # needed the repository to exist first).
  deploy-backend-dev:
    needs: build-backend
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
    outputs:
      version_id: ${{ steps.upload.outputs.version_id }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: backend-lambda-package

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Upload to S3 and update the Lambda function
        id: upload
        run: |
          aws s3 cp lambda_package.zip s3://equicast-backend-deploy-dev/backend.zip
          VERSION_ID=$(aws s3api head-object \
            --bucket equicast-backend-deploy-dev --key backend.zip \
            --query VersionId --output text)
          echo "version_id=$VERSION_ID" >> "$GITHUB_OUTPUT"

          aws lambda update-function-code \
            --function-name equicast-backend-dev \
            --s3-bucket equicast-backend-deploy-dev \
            --s3-key backend.zip \
            --s3-object-version "$VERSION_ID"

  # Gated behind the "production" GitHub Environment's required reviewers
  # (Settings -> Environments -> production). Copies the *same* S3 object
  # version deploy-backend-dev just uploaded (rather than rebuilding) into
  # the prod bucket, then points prod's Lambda function at that copy — the
  # same "promote the exact artifact that ran in dev" principle the old ECR
  # flow used (tagging one image as "prod" rather than rebuilding).
  deploy-backend-prod:
    needs: deploy-backend-dev
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Promote dev artifact to prod
        run: |
          aws s3api copy-object \
            --bucket equicast-backend-deploy-prod \
            --key backend.zip \
            --copy-source "equicast-backend-deploy-dev/backend.zip?versionId=${{ needs.deploy-backend-dev.outputs.version_id }}"

          VERSION_ID=$(aws s3api head-object \
            --bucket equicast-backend-deploy-prod --key backend.zip \
            --query VersionId --output text)

          aws lambda update-function-code \
            --function-name equicast-backend-prod \
            --s3-bucket equicast-backend-deploy-prod \
            --s3-key backend.zip \
            --s3-object-version "$VERSION_ID"

  # Builds once, with no environment-specific config, purely so its real
  # size is known before anyone is asked to approve a spend — NOT the
  # artifact that gets deployed. deploy-frontend-dev/-prod each build
  # again with their own VITE_API_BASE_URL (see below), since that
  # genuinely differs per environment (separate backend deployments) —
  # unlike the backend zip, this can't be built once and promoted as the
  # identical artifact.
  estimate-frontend:
    if: github.event.workflow_run.name == 'Frontend CI' && github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: frontend
        run: |
          npm ci
          npm run build

      - name: Estimate incremental cost
        working-directory: frontend
        run: |
          SIZE_BYTES=$(du -sb dist | cut -f1)
          SIZE_GB=$(awk "BEGIN { printf \"%.6f\", $SIZE_BYTES / 1000000000 }")
          FILE_COUNT=$(find dist -type f | wc -l)
          # Rough, region-approximate S3/CloudFront rates (eu-west-1 origin,
          # PriceClass_100 edge locations) — verify against
          # https://aws.amazon.com/s3/pricing/ and
          # https://aws.amazon.com/cloudfront/pricing/ if this needs to be
          # precise. Doesn't attempt to estimate CloudFront's own data
          # transfer/request cost (unlike S3, it depends on cache hit ratio
          # and visitor count, not build size) — see
          # infra/infracost-usage.yml for that side instead, and note both
          # are comfortably inside CloudFront's 1TB/10M-request AWS Free
          # Tier for a new account's first 12 months regardless.
          S3_GB_MONTH_USD=0.023
          S3_PUT_PER_1000_USD=0.005
          STORAGE_COST=$(awk "BEGIN { printf \"%.6f\", $SIZE_GB * $S3_GB_MONTH_USD }")
          PUT_COST=$(awk "BEGIN { printf \"%.6f\", $FILE_COUNT / 1000 * $S3_PUT_PER_1000_USD }")
          {
            echo "### Frontend deploy cost estimate"
            echo ""
            echo "| Metric | Value |"
            echo "|---|---|"
            echo "| Build size | ${SIZE_GB} GB across ${FILE_COUNT} files |"
            echo "| Added monthly storage cost | ~\$${STORAGE_COST}/month (at \$${S3_GB_MONTH_USD}/GB-month) |"
            echo "| One-time upload (PUT) cost | ~\$${PUT_COST} (at \$${S3_PUT_PER_1000_USD}/1,000 requests) |"
            echo ""
            echo "⚠️ S3 side only, rough estimate, per environment this is synced to"
            echo "(dev and prod each pay this independently). Excludes CloudFront's"
            echo "own usage-based cost — see infra/infracost-usage.yml. Built with no"
            echo "VITE_* config, so real bundle size may differ slightly — close enough"
            echo "for an order-of-magnitude estimate."
          } >> "$GITHUB_STEP_SUMMARY"

  # Gated behind the "development" GitHub Environment's required reviewers.
  # `needs: estimate-frontend` is ordering only now (no artifact passed) —
  # keeps the cost estimate visible before this gate can be approved.
  #
  # Builds its own copy with this environment's config baked in at build
  # time (Vite inlines import.meta.env.VITE_* into the bundle, it isn't
  # readable at runtime) — API_URL and CLOUDFRONT_DISTRIBUTION_ID are both
  # values Terraform generates, so neither can be hardcoded here the way
  # the bucket name can; see docs/terraform-state-setup.md's Step 4 for
  # setting both after `terraform output`. AUTH0_DOMAIN/AUTH0_AUDIENCE are
  # the same repo variables the backend already uses (one shared Auth0
  # tenant/API for both environments — see docs/auth0-setup.md);
  # AUTH0_CLIENT_ID is new here, the frontend's own SPA Application has no
  # backend equivalent.
  deploy-frontend-dev:
    needs: estimate-frontend
    runs-on: ubuntu-latest
    environment: development
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.API_URL }}
          VITE_AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Sync to S3
        working-directory: frontend
        run: aws s3 sync dist s3://equicast-frontend-dev --delete

      # Without this, CloudFront keeps serving cached (stale) responses —
      # including a stale index.html referencing since-deleted hashed
      # asset filenames — for up to the cache policy's TTL after a sync.
      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"

  # Gated behind the "production" GitHub Environment's required reviewers.
  # Its own build, not a promotion of deploy-frontend-dev's — dev and prod
  # legitimately need different VITE_API_BASE_URL/CLOUDFRONT_DISTRIBUTION_ID
  # values baked in (separate backend deployments, separate CloudFront
  # distributions), so unlike deploy-backend-prod there's no single
  # artifact to promote byte-for-byte. `needs: deploy-frontend-dev` is
  # kept for the same "prod only after dev" ordering the backend jobs use,
  # not because it reuses dev's build.
  deploy-frontend-prod:
    needs: deploy-frontend-dev
    runs-on: ubuntu-latest
    environment: production
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        working-directory: frontend
        env:
          VITE_API_BASE_URL: ${{ vars.API_URL }}
          VITE_AUTH0_DOMAIN: ${{ vars.AUTH0_DOMAIN }}
          VITE_AUTH0_CLIENT_ID: ${{ vars.AUTH0_CLIENT_ID }}
          VITE_AUTH0_AUDIENCE: ${{ vars.AUTH0_AUDIENCE }}
        run: |
          npm ci
          npm run build

      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Sync to S3
        working-directory: frontend
        run: aws s3 sync dist s3://equicast-frontend-prod --delete

      - name: Invalidate CloudFront cache
        run: |
          aws cloudfront create-invalidation \
            --distribution-id "${{ vars.CLOUDFRONT_DISTRIBUTION_ID }}" \
            --paths "/*"
