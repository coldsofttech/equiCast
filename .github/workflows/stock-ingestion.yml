name: Stock Ingestion

on:
  # Runs 30 minutes after etf-ingestion.yml's "15 22 * * 1-5" (22:15 UTC) —
  # 45 minutes after fx-ingestion.yml's "0 22 * * 1-5" (22:00 UTC,
  # Monday-Friday only — after both US and UK markets close, see that
  # workflow's comment) — so all three never overlap even if an earlier
  # run takes longer than expected.
  #
  # The second entry (Saturday, same time) is forecasting-only — see
  # "Resolve target environment, bucket, and config" below. equicast-stock
  # itself stays Monday-Friday: both US markets are shut every
  # Saturday/Sunday, so a weekend ingest run would only ever refetch
  # Friday's already-fetched data (same reasoning as fx-pipeline.md's
  # Monday-Friday schedule). equicast-forecasting has no such calendar
  # dependency (it's a full recompute from whatever dividend history is
  # already on file, not new market data), so it runs the other direction:
  # once a week is plenty, daily would just repeat the same projection.
  schedule:
    - cron: "45 22 * * 1-5"
    - cron: "45 22 * * 6"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run against"
        type: choice
        options:
          - dev
          - production
        default: dev
      full_load:
        description: "Full historical load (all years) instead of current year only"
        type: boolean
        default: false
      chunk_size:
        description: "Target stock tickers per parallel chunk"
        default: "300"
      tickers:
        description: "Optional: restrict this run to specific tickers, separated by ; (e.g. NWG.L;AAPL). Leave blank to run against every configured ticker."
        default: ""
      max_workers:
        description: "Concurrent fetches within each container"
        default: "5"
      max_calls:
        description: "Max yfinance calls per period-seconds, per container"
        default: "5"
      period_seconds:
        description: "Rate-limit window in seconds, per container"
        default: "1.0"
      forecast_years:
        description: "Dividend forecast horizon in years"
        default: "10"
      forecast_only:
        description: "Run only equicast-forecasting, skipping the regular ingest (mirrors the Saturday schedule)"
        type: boolean
        default: false

permissions:
  id-token: write
  packages: read
  contents: read

jobs:
  # Splits the configured stock tickers into chunks so the ingest job below
  # can process them across parallel matrix legs instead of one long-running
  # container. GitHub caps a workflow's matrix at 256 jobs, so
  # equicast-stock-plan grows the chunk size (rather than dropping tickers)
  # if the full ticker list would otherwise need more chunks than that.
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      has_chunks: ${{ steps.plan.outputs.has_chunks }}
      environment: ${{ steps.env.outputs.environment }}
      bucket: ${{ steps.env.outputs.bucket }}
      run_ingest: ${{ steps.env.outputs.run_ingest }}
      run_forecasting: ${{ steps.env.outputs.run_forecasting }}
      targeted: ${{ steps.env.outputs.targeted }}
      image_tag: ${{ steps.env.outputs.image_tag }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      # Scheduled runs always target production, regardless of the
      # workflow_dispatch default below — there's no input to read on a
      # cron trigger. Manual runs pick dev/production via the "environment"
      # input. Resolved once here, before the chunk computation below, so
      # every chunk both reads the right config file (stocks.dev.yaml vs.
      # stocks.prod.yaml) and uploads to the same bucket, and a missing
      # variable fails fast, before any container spends time fetching data.
      # Reuses the same MARKET_DATA_BUCKET_DEV/MARKET_DATA_BUCKET_PROD repo
      # variables fx-ingestion.yml uses — stock profiles land in the same
      # bucket.
      - name: Resolve target environment, bucket, config, and run mode
        id: env
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ENVIRONMENT=production
            # ISO weekday, 1=Monday..7=Sunday: only the Saturday (6) cron
            # entry above forecasts; the Monday-Friday entry ingests.
            if [ "$(date -u +%u)" = "6" ]; then
              RUN_INGEST=false
              RUN_FORECASTING=true
            else
              RUN_INGEST=true
              RUN_FORECASTING=false
            fi
          else
            ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
            if [ "${{ github.event.inputs.forecast_only || 'false' }}" = "true" ]; then
              RUN_INGEST=false
              RUN_FORECASTING=true
            else
              RUN_INGEST=true
              RUN_FORECASTING=false
            fi
          fi

          if [ "$ENVIRONMENT" = "production" ]; then
            BUCKET="${{ vars.MARKET_DATA_BUCKET_PROD }}"
            CONFIG="config/stocks.prod.yaml"
          else
            BUCKET="${{ vars.MARKET_DATA_BUCKET_DEV }}"
            CONFIG="config/stocks.dev.yaml"
          fi

          if [ -z "$BUCKET" ]; then
            echo "::error::MARKET_DATA_BUCKET_$(echo "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]') repo variable is not set"
            exit 1
          fi

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"
          echo "config=$CONFIG" >> "$GITHUB_OUTPUT"
          echo "run_ingest=$RUN_INGEST" >> "$GITHUB_OUTPUT"
          echo "run_forecasting=$RUN_FORECASTING" >> "$GITHUB_OUTPUT"
          # Whether this run is restricted to a "tickers" subset — the
          # build-catalog job below reads this to merge into the existing
          # catalog instead of replacing it outright, since a targeted run's
          # output only ever covers part of the full ticker list.
          if [ -n "${{ github.event.inputs.tickers }}" ]; then
            echo "targeted=true" >> "$GITHUB_OUTPUT"
          else
            echo "targeted=false" >> "$GITHUB_OUTPUT"
          fi

          # equicast-support#185: dev/vX.Y branches (see images.yml's
          # build-push-image composite action) push a :dev tag rather than
          # overwriting :latest - this run pulls whichever one matches the
          # branch it's actually running from, so a dev/v1.1 run tests
          # dev/v1.1's own image rather than silently falling back to
          # main's.
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "image_tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "image_tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Compute stock ticker chunks
        id: plan
        working-directory: packages/stock
        run: |
          CHUNKS=$(uv run equicast-stock-plan \
            --config "${{ steps.env.outputs.config }}" \
            --chunk-size "${{ github.event.inputs.chunk_size || '300' }}" \
            --max-chunks 256 \
            --tickers "${{ github.event.inputs.tickers || '' }}")
          echo "chunks=$CHUNKS" >> "$GITHUB_OUTPUT"
          if [ "$CHUNKS" = "[]" ]; then
            echo "has_chunks=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_chunks=true" >> "$GITHUB_OUTPUT"
          fi

  ingest:
    needs: plan
    if: needs.plan.outputs.has_chunks == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Caps how many legs run at once, independent of the matrix size (up to
      # 256 legs) computed by the plan job above. Tune to your account's
      # concurrent-job limit and to how hard you want to hit Yahoo Finance at
      # once (each leg runs on a separate runner, so a separate source IP).
      max-parallel: 20
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      # Needed to resolve `uses: ./.github/actions/configure-aws` below - a
      # local composite action can't be resolved without the repo checked
      # out first (see build-push-image for the same constraint). Not
      # needed for anything else in this job - the docker/AWS CLI steps
      # below don't read repo source.
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Prepare output directory
        run: mkdir -p output

      - name: Pull equicast-stock image
        if: needs.plan.outputs.run_ingest == 'true'
        run: docker pull ghcr.io/${{ github.repository_owner }}/equicast-stock:${{ needs.plan.outputs.image_tag }}

      - name: Extract this chunk's stock ticker profiles and prices
        if: needs.plan.outputs.run_ingest == 'true'
        run: |
          docker run --rm \
            -v "${PWD}/output:/output" \
            ghcr.io/${{ github.repository_owner }}/equicast-stock:${{ needs.plan.outputs.image_tag }} \
            --tickers-json '${{ toJson(matrix.chunk) }}' \
            --out /output \
            ${{ github.event.inputs.full_load == 'true' && '--full-load' || '' }} \
            --max-workers "${{ github.event.inputs.max_workers || '5' }}" \
            --max-calls "${{ github.event.inputs.max_calls || '5' }}" \
            --period-seconds "${{ github.event.inputs.period_seconds || '1.0' }}"

      - name: Pull equicast-forecasting image
        if: needs.plan.outputs.run_forecasting == 'true'
        run: docker pull ghcr.io/${{ github.repository_owner }}/equicast-forecasting:${{ needs.plan.outputs.image_tag }}

      # Independent of the equicast-stock step above — its own DividendsClient
      # fetch, not a read-back of dividend.parquet — but writes into the same
      # /output directory, so this chunk's forecasting/dividends.parquet rides
      # along in the one upload step below rather than needing its own.
      - name: Forecast this chunk's stock dividend payouts
        if: needs.plan.outputs.run_forecasting == 'true'
        run: |
          docker run --rm \
            -v "${PWD}/output:/output" \
            ghcr.io/${{ github.repository_owner }}/equicast-forecasting:${{ needs.plan.outputs.image_tag }} \
            --asset-class stock \
            --tickers-json '${{ toJson(matrix.chunk) }}' \
            --out /output \
            --years "${{ github.event.inputs.forecast_years || '10' }}" \
            --max-workers "${{ github.event.inputs.max_workers || '5' }}" \
            --max-calls "${{ github.event.inputs.max_calls || '5' }}" \
            --period-seconds "${{ github.event.inputs.period_seconds || '1.0' }}"

      - name: Configure AWS credentials via OIDC
        uses: ./.github/actions/configure-aws
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      # Moved out of output/ before the S3 upload below so this chunk's
      # failures.json (if any - see equicast_stock.writer.write_failures_manifest,
      # written whenever a ticker's task fails; GitHub issue equicast-support#145)
      # never lands in S3 alongside the Hive-partitioned stock=*/... data.
      # Renamed with this leg's matrix index so multiple chunks' failures.json
      # - each written to the same relative path inside its own chunk's
      # output/ - don't collide once report-status downloads every chunk's
      # artifact into one shared directory (see merge_failures.py).
      - name: Set aside this chunk's failures manifest, if any
        if: needs.plan.outputs.run_ingest == 'true'
        run: |
          mkdir -p chunk-failures
          if [ -f output/failures.json ]; then
            mv output/failures.json "chunk-failures/failures-${{ strategy.job-index }}.json"
          fi

      - name: Upload stock profiles, prices, and forecasts to S3
        run: aws s3 cp output/ "s3://${{ needs.plan.outputs.bucket }}/" --recursive

      # Feeds build-catalog below — that job needs every chunk's
      # profile.parquet files in one place to build a complete catalog, and
      # a matrix leg only ever sees its own chunk. Short retention: this
      # artifact only exists to hand off within this run, not for later
      # reference (see equicast_core.catalog's module docstring for why the
      # catalog can't be built inside this per-chunk job at all). Also
      # carries this chunk's failures-<index>.json (see above), if any -
      # report-status's failures merge step below needs every chunk's, the
      # same way build-catalog needs every chunk's profile.parquet.
      - name: Publish this chunk's profiles for the catalog build
        if: needs.plan.outputs.run_ingest == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: stock-profiles-${{ strategy.job-index }}
          path: |
            output/stock=*/profile.parquet
            chunk-failures/failures-*.json
          retention-days: 1

  # Rebuilds catalog/stock.parquet (see equicast_core.catalog) from every
  # chunk's freshly-fetched profiles, merged back together here since no
  # single ingest leg above ever sees the full ticker list. Needs no new S3
  # permission beyond what ingest already has (s3:PutObject) — it reads the
  # profiles locally, from the downloaded artifacts, not back from S3.
  # Skipped on a forecasting-only run (Saturday, or manual forecast_only) —
  # ingest didn't publish any profile artifacts that run, so there's nothing
  # new to rebuild the catalog from.
  #
  # A targeted run (plan.outputs.targeted, from the "tickers" input) only
  # ever fetched a subset of the full ticker list, so its build-catalog step
  # below passes --merge instead of letting equicast-core-build-catalog
  # replace the whole catalog with just that subset.
  build-catalog:
    needs: [plan, ingest]
    if: needs.plan.outputs.has_chunks == 'true' && needs.plan.outputs.run_ingest == 'true'
    runs-on: ubuntu-latest
    # Overrides the workflow-level defaults: drops packages:read (unused
    # here — this job never pulls a GHCR image). No issues:write needed —
    # the missing-ISIN issue sync below files into equicast-support via
    # SUPPORT_ISSUE_TOKEN, not this repo's own GITHUB_TOKEN.
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Download every chunk's profiles
        uses: actions/download-artifact@v4
        with:
          pattern: stock-profiles-*
          path: output
          merge-multiple: true

      - name: Configure AWS credentials via OIDC
        uses: ./.github/actions/configure-aws
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}

      - name: Build and upload the stock search catalog
        working-directory: packages/core
        run: |
          uv run equicast-core-build-catalog \
            --asset-class stock \
            --output-dir "${{ github.workspace }}/output" \
            --bucket "${{ needs.plan.outputs.bucket }}" \
            ${{ needs.plan.outputs.targeted == 'true' && '--merge' || '' }}

      # GitHub issue #215: consolidate tickers with no ISIN on record and
      # notify via a persistent parent GitHub issue with one native
      # sub-issue per missing ticker, rather than a separate email
      # integration (GitHub already emails watchers when an issue is
      # opened/updated). Reads the catalog just uploaded above — it
      # already carries each ticker's isin (see equicast_core.catalog) —
      # rather than re-scanning every chunk's individual profile.parquet.
      - name: Download the freshly-built catalog
        run: aws s3 cp "s3://${{ needs.plan.outputs.bucket }}/catalog/stock.parquet" catalog.parquet

      - name: Find tickers missing ISIN
        id: missing_isin
        working-directory: packages/core
        run: |
          TICKERS=$(uv run python "${{ github.workspace }}/.github/scripts/find_missing_isin.py" \
            --catalog "${{ github.workspace }}/catalog.parquet")
          echo "tickers=$TICKERS" >> "$GITHUB_OUTPUT"

      - name: Sync missing-ISIN tracking issue
        env:
          GH_TOKEN: ${{ secrets.SUPPORT_ISSUE_TOKEN }}
        run: |
          bash .github/scripts/sync-missing-isin-issue.sh \
            "${{ vars.SUPPORT_REPO }}" \
            "Stock ingestion: tickers missing ISIN" \
            "stock" \
            "packages/stock/config/stocks.prod.yaml" \
            "${{ steps.missing_isin.outputs.tickers }}"

  # GitHub issue equicast-support#145: previously a failed run here was only
  # visible via the red X on the Actions tab. Reports pipeline health to
  # equicast-support (reusing the missing-ISIN sync's
  # SUPPORT_ISSUE_TOKEN/SUPPORT_REPO pattern above) - a single rolling issue
  # for overall job/infra health (see sync-pipeline-failure-issue.sh), plus
  # one native sub-issue per ticker whose own data extraction is currently
  # failing (see sync-pipeline-failure-subissues.sh; a per-ticker failure no
  # longer fails the whole chunk - see equicast_stock.cli.run()). Runs
  # regardless of whether plan/ingest/build-catalog succeeded, failed, or
  # were skipped, so it can both report a new failure and auto-close a
  # previously-reported one once a run succeeds again.
  report-status:
    needs: [plan, ingest, build-catalog]
    if: always()
    runs-on: ubuntu-latest
    permissions:
      contents: read
      actions: read
    steps:
      - uses: actions/checkout@v4

      - name: Sync pipeline status
        uses: ./.github/actions/sync-pipeline-status
        with:
          pipeline-label: Stock
          artifact-prefix: stock-profiles-
          plan-result: ${{ needs.plan.result }}
          ingest-result: ${{ needs.ingest.result }}
          build-catalog-result: ${{ needs.build-catalog.result }}
          targeted: ${{ needs.plan.outputs.targeted }}
          run-ingest: ${{ needs.plan.outputs.run_ingest }}
          support-repo: ${{ vars.SUPPORT_REPO }}
          support-issue-token: ${{ secrets.SUPPORT_ISSUE_TOKEN }}
          github-token: ${{ secrets.GITHUB_TOKEN }}

  # GitHub issue equicast-support#169: stock-profiles-*'s per-chunk
  # profile.parquet is only ever needed to hand off to build-catalog above
  # (and, alongside it, each chunk's failures-<index>.json to report-status
  # - see that job's own comments) within this one run - not for later
  # reference. Deletes it once both are done rather than relying on
  # retention-days: 1 to eventually reclaim it, so a run's artifacts list
  # doesn't sit around holding already-consumed per-chunk data.
  # needs.build-catalog.result == 'success' (guarded with always() so
  # report-status's own result doesn't matter here) rather than the
  # default "both needs succeeded" - the catalog must have actually built
  # and pushed to S3 first, matching the issue's own wording, but
  # report-status runs via if: always() and can legitimately end in any
  # state once it's had its chance to read the artifacts.
  cleanup-profile-artifacts:
    needs: [build-catalog, report-status]
    if: always() && needs.build-catalog.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      actions: write
    steps:
      # Needed to resolve `uses: ./.github/actions/cleanup-artifacts` below
      # - see cleanup-artifacts's own header comment for why.
      - uses: actions/checkout@v4

      - name: Delete per-chunk profile artifacts
        uses: ./.github/actions/cleanup-artifacts
        with:
          artifact-prefix: stock-profiles-
          github-token: ${{ secrets.GITHUB_TOKEN }}
