name: Stock Ingestion

on:
  # Offset 2h from fx-ingestion.yml's "0 */6 * * *" (00:00/06:00/12:00/18:00
  # UTC) so the two never overlap even if a run takes longer than expected.
  schedule:
    - cron: "0 2,8,14,20 * * *"
  workflow_dispatch:
    inputs:
      environment:
        description: "Environment to run against"
        type: choice
        options:
          - dev
          - production
        default: dev
      full_load:
        description: "Full historical load (all years) instead of current year only"
        type: boolean
        default: false
      chunk_size:
        description: "Target stock tickers per parallel chunk"
        default: "300"
      max_workers:
        description: "Concurrent fetches within each container"
        default: "5"
      max_calls:
        description: "Max yfinance calls per period-seconds, per container"
        default: "5"
      period_seconds:
        description: "Rate-limit window in seconds, per container"
        default: "1.0"

permissions:
  id-token: write
  packages: read
  contents: read

jobs:
  # Splits the configured stock tickers into chunks so the ingest job below
  # can process them across parallel matrix legs instead of one long-running
  # container. GitHub caps a workflow's matrix at 256 jobs, so
  # equicast-stock-plan grows the chunk size (rather than dropping tickers)
  # if the full ticker list would otherwise need more chunks than that.
  plan:
    runs-on: ubuntu-latest
    outputs:
      chunks: ${{ steps.plan.outputs.chunks }}
      has_chunks: ${{ steps.plan.outputs.has_chunks }}
      environment: ${{ steps.env.outputs.environment }}
      bucket: ${{ steps.env.outputs.bucket }}
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Compute stock ticker chunks
        id: plan
        working-directory: packages/stock
        run: |
          CHUNKS=$(uv run equicast-stock-plan \
            --config config/stocks.yaml \
            --chunk-size "${{ github.event.inputs.chunk_size || '300' }}" \
            --max-chunks 256)
          echo "chunks=$CHUNKS" >> "$GITHUB_OUTPUT"
          if [ "$CHUNKS" = "[]" ]; then
            echo "has_chunks=false" >> "$GITHUB_OUTPUT"
          else
            echo "has_chunks=true" >> "$GITHUB_OUTPUT"
          fi

      # Scheduled runs always target production, regardless of the
      # workflow_dispatch default below — there's no input to read on a
      # cron trigger. Manual runs pick dev/production via the "environment"
      # input. Resolved once here (not per matrix leg in the ingest job) so
      # every chunk uploads to the same bucket and a missing variable fails
      # fast, before any container spends time fetching data. Reuses the
      # same MARKET_DATA_BUCKET_DEV/MARKET_DATA_BUCKET_PROD repo variables
      # fx-ingestion.yml uses — stock profiles land in the same bucket.
      - name: Resolve target environment and bucket
        id: env
        run: |
          if [ "${{ github.event_name }}" = "schedule" ]; then
            ENVIRONMENT=production
          else
            ENVIRONMENT="${{ github.event.inputs.environment || 'dev' }}"
          fi

          if [ "$ENVIRONMENT" = "production" ]; then
            BUCKET="${{ vars.MARKET_DATA_BUCKET_PROD }}"
          else
            BUCKET="${{ vars.MARKET_DATA_BUCKET_DEV }}"
          fi

          if [ -z "$BUCKET" ]; then
            echo "::error::MARKET_DATA_BUCKET_$(echo "$ENVIRONMENT" | tr '[:lower:]' '[:upper:]') repo variable is not set"
            exit 1
          fi

          echo "environment=$ENVIRONMENT" >> "$GITHUB_OUTPUT"
          echo "bucket=$BUCKET" >> "$GITHUB_OUTPUT"

  ingest:
    needs: plan
    if: needs.plan.outputs.has_chunks == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Caps how many legs run at once, independent of the matrix size (up to
      # 256 legs) computed by the plan job above. Tune to your account's
      # concurrent-job limit and to how hard you want to hit Yahoo Finance at
      # once (each leg runs on a separate runner, so a separate source IP).
      max-parallel: 20
      matrix:
        chunk: ${{ fromJson(needs.plan.outputs.chunks) }}
    steps:
      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Pull equicast-stock image
        run: docker pull ghcr.io/${{ github.repository_owner }}/equicast-stock:latest

      - name: Extract this chunk's stock ticker profiles and prices
        run: |
          mkdir -p output
          docker run --rm \
            -v "${PWD}/output:/output" \
            ghcr.io/${{ github.repository_owner }}/equicast-stock:latest \
            --tickers-json '${{ toJson(matrix.chunk) }}' \
            --out /output \
            ${{ github.event.inputs.full_load == 'true' && '--full-load' || '' }} \
            --max-workers "${{ github.event.inputs.max_workers || '5' }}" \
            --max-calls "${{ github.event.inputs.max_calls || '5' }}" \
            --period-seconds "${{ github.event.inputs.period_seconds || '1.0' }}"

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Upload stock profiles and prices to S3
        run: aws s3 cp output/ "s3://${{ needs.plan.outputs.bucket }}/" --recursive

      # Feeds build-catalog below — that job needs every chunk's
      # profile.parquet files in one place to build a complete catalog, and
      # a matrix leg only ever sees its own chunk. Short retention: this
      # artifact only exists to hand off within this run, not for later
      # reference (see equicast_core.catalog's module docstring for why the
      # catalog can't be built inside this per-chunk job at all).
      - name: Publish this chunk's profiles for the catalog build
        uses: actions/upload-artifact@v4
        with:
          name: stock-profiles-${{ strategy.job-index }}
          path: output/stock=*/profile.parquet
          retention-days: 1

  # Rebuilds catalog/stock.json (see equicast_core.catalog) from every
  # chunk's freshly-fetched profiles, merged back together here since no
  # single ingest leg above ever sees the full ticker list. Needs no new S3
  # permission beyond what ingest already has (s3:PutObject) — it reads the
  # profiles locally, from the downloaded artifacts, not back from S3.
  build-catalog:
    needs: [plan, ingest]
    if: needs.plan.outputs.has_chunks == 'true'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v3
        with:
          enable-cache: true

      - name: Download every chunk's profiles
        uses: actions/download-artifact@v4
        with:
          pattern: stock-profiles-*
          path: output
          merge-multiple: true

      - name: Configure AWS credentials via OIDC
        uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ secrets.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION || 'eu-west-1' }}

      - name: Build and upload the stock search catalog
        working-directory: packages/core
        run: |
          uv run equicast-core-build-catalog \
            --asset-class stock \
            --output-dir "${{ github.workspace }}/output" \
            --bucket "${{ needs.plan.outputs.bucket }}"
