name: Issue Automation Fix

# Single repository_dispatch receiver for every "reply to an issue in
# equicast-support to trigger automation here" scenario - replaces one
# fix workflow per scenario. Fired by equicast-support's
# dispatch-issue-automation.yml once a maintainer's reply is recognized
# by one of its scenario plugins; `github.event.action` is GitHub's own
# echo of the dispatch's `event_type`, used below to route to that
# scenario's apply script without needing a redundant field in the
# payload. See docs/github-issue-automations.md for the general pattern
# and how to add a new scenario.
#
# Always operates against main: repository_dispatch already only reads
# this workflow's definition from the default branch, and the checkout
# below pins `ref: main` explicitly rather than trusting anything in the
# dispatch payload, so nothing here can be pointed at another branch.
on:
  repository_dispatch:
    types: [missing-isin-provided, config-change-requested]

permissions:
  contents: write
  pull-requests: write

jobs:
  apply-fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Apply the fix
        id: apply
        env:
          SCENARIO: ${{ github.event.action }}
          TICKER: ${{ github.event.client_payload.ticker }}
          ISIN: ${{ github.event.client_payload.isin }}
          TAX_DOMICILE: ${{ github.event.client_payload.tax_domicile }}
          ISIN_CONFIG_PATH: ${{ github.event.client_payload.config_path }}
          ASSET_CLASS: ${{ github.event.client_payload.asset_class }}
          ENVIRONMENT: ${{ github.event.client_payload.environment }}
          ACTION: ${{ github.event.client_payload.action }}
          KEY: ${{ github.event.client_payload.key }}
          SYMBOL: ${{ github.event.client_payload.symbol }}
          RUN_ID: ${{ github.run_id }}
        run: |
          case "$SCENARIO" in
            missing-isin-provided)
              # Run from packages/stock so `uv run` resolves that
              # package's own venv (apply_isin_override.py imports
              # PyYAML, a stock/etf dependency, not a repo-root one).
              (cd packages/stock && uv run python "$GITHUB_WORKSPACE/.github/scripts/apply_isin_override.py" \
                --ticker "$TICKER" --isin "$ISIN" --tax-domicile "$TAX_DOMICILE" \
                --config-path "$ISIN_CONFIG_PATH" --repo-root "$GITHUB_WORKSPACE")

              echo "branch=isin/${TICKER}" >> "$GITHUB_OUTPUT"
              echo "git_add=$ISIN_CONFIG_PATH" >> "$GITHUB_OUTPUT"
              echo "commit_message=Add ISIN override for $TICKER" >> "$GITHUB_OUTPUT"
              echo "subject=$TICKER" >> "$GITHUB_OUTPUT"
              ;;

            config-change-requested)
              ARGS=(--asset-class "$ASSET_CLASS" --environment "$ENVIRONMENT" --action "$ACTION" --key "$KEY")
              [ -n "$ISIN" ] && ARGS+=(--isin "$ISIN")
              [ -n "$TAX_DOMICILE" ] && ARGS+=(--tax-domicile "$TAX_DOMICILE")
              [ -n "$SYMBOL" ] && ARGS+=(--symbol "$SYMBOL")

              SUMMARY=$(uv run --with ruamel.yaml python .github/scripts/manage_config_entry.py "${ARGS[@]}")
              echo "$SUMMARY"

              SAFE_KEY=$(echo "$KEY" | tr -c 'A-Za-z0-9' '-' | sed 's/-\+/-/g; s/^-//; s/-$//')
              echo "branch=config/${ASSET_CLASS}-${ENVIRONMENT}-${ACTION}-${SAFE_KEY}-${RUN_ID}" >> "$GITHUB_OUTPUT"
              echo "git_add=packages/${ASSET_CLASS}/config/*.yaml" >> "$GITHUB_OUTPUT"
              echo "subject=$KEY" >> "$GITHUB_OUTPUT"
              # A random delimiter, not a fixed "EOF" - $KEY/$ISIN/etc.
              # (echoed back into $SUMMARY by the script above) came from
              # an untrusted issue comment, so a fixed delimiter could in
              # principle be spoofed into terminating this block early.
              DELIM="EOF_$(uuidgen)"
              {
                echo "commit_message<<$DELIM"
                echo "$SUMMARY (${ASSET_CLASS}/${ENVIRONMENT})"
                echo "$DELIM"
              } >> "$GITHUB_OUTPUT"
              ;;

            *)
              echo "::error::Unknown scenario '$SCENARIO'"
              exit 1
              ;;
          esac

      - name: Create branch, commit, and push
        env:
          BRANCH: ${{ steps.apply.outputs.branch }}
          GIT_ADD: ${{ steps.apply.outputs.git_add }}
          COMMIT_MESSAGE: ${{ steps.apply.outputs.commit_message }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add $GIT_ADD
          git commit -m "$COMMIT_MESSAGE"
          git push -u origin "$BRANCH"

      - name: Open PR
        env:
          # github.token can't create pull requests unless the repo-wide
          # "Allow GitHub Actions to create and approve pull requests"
          # setting is on - deliberately left off, since that setting would
          # grant the capability to every workflow in this repo, not just
          # this one. PR_CREATE_TOKEN is a PAT scoped only to equicast,
          # dedicated to this step.
          GH_TOKEN: ${{ secrets.PR_CREATE_TOKEN }}
          SCENARIO: ${{ github.event.action }}
          BRANCH: ${{ steps.apply.outputs.branch }}
          COMMIT_MESSAGE: ${{ steps.apply.outputs.commit_message }}
          TICKER: ${{ github.event.client_payload.ticker }}
          ISIN: ${{ github.event.client_payload.isin }}
          ISIN_CONFIG_PATH: ${{ github.event.client_payload.config_path }}
          ASSET_CLASS: ${{ github.event.client_payload.asset_class }}
          ENVIRONMENT: ${{ github.event.client_payload.environment }}
          ACTION: ${{ github.event.client_payload.action }}
          KEY: ${{ github.event.client_payload.key }}
          ISSUE_URL: ${{ github.event.client_payload.issue_url }}
        run: |
          # Cross-repo closing keyword: coldsofttech owns both repos, so
          # this closes the originating equicast-support issue as soon as
          # the PR merges, rather than requiring a manual close.
          ISSUE_REPO=$(echo "$ISSUE_URL" | sed -E 's#https://github.com/([^/]+/[^/]+)/issues/.*#\1#')
          ISSUE_NUMBER=$(echo "$ISSUE_URL" | sed -E 's#.*/issues/##')
          CLOSES="Closes ${ISSUE_REPO}#${ISSUE_NUMBER}"

          case "$SCENARIO" in
            missing-isin-provided)
              BODY="$CLOSES

          Adds the ISIN override for \`$TICKER\` (\`$ISIN\`) in \`$ISIN_CONFIG_PATH\`, provided in $ISSUE_URL."
              ;;
            config-change-requested)
              BODY="$CLOSES

          $COMMIT_MESSAGE, requested via $ISSUE_URL.

          | Field | Value |
          |---|---|
          | asset_class | \`${ASSET_CLASS}\` |
          | environment | \`${ENVIRONMENT}\` |
          | action | \`${ACTION}\` |
          | key | \`${KEY}\` |"
              ;;
          esac

          PR_URL=$(gh pr create --base main --head "$BRANCH" --title "$COMMIT_MESSAGE" --body "$BODY")
          echo "$PR_URL" >> "$GITHUB_STEP_SUMMARY"

          # Best-effort: only takes effect if this repo has "Allow
          # auto-merge" enabled and the PR's required checks pass -
          # otherwise it's left open for a manual merge like any other PR.
          gh pr merge --auto --squash "$PR_URL" \
            || echo "::warning::Auto-merge could not be enabled - merge $PR_URL manually once checks pass."

      - name: Report failure back to the originating issue
        if: failure()
        env:
          GH_TOKEN: ${{ secrets.SUPPORT_ISSUE_TOKEN }}
          ISSUE_URL: ${{ github.event.client_payload.issue_url }}
          SUBJECT: ${{ steps.apply.outputs.subject }}
        run: |
          REPO=$(echo "$ISSUE_URL" | sed -E 's#https://github.com/([^/]+/[^/]+)/issues/.*#\1#')
          NUMBER=$(echo "$ISSUE_URL" | sed -E 's#.*/issues/##')
          gh issue comment "$NUMBER" --repo "$REPO" \
            --body "The change for \`${SUBJECT:-this request}\` couldn't be applied automatically - see the failed run: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
