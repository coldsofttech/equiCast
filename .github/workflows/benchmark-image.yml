name: Build Benchmark Image

on:
  push:
    # dev/** covers the dev/vX.Y integration branches for a release about
    # to ship (equicast-support#185) - see "Determine image tag" below for
    # why this never overwrites the :latest tag main pushes here.
    branches: [main, "dev/**"]
    paths:
      - "packages/datafeed/**"
      - "packages/benchmark/**"
      - "pyproject.toml"
      - "uv.lock"
      - ".github/workflows/benchmark-image.yml"
  workflow_dispatch: {}

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # equicast-support#185: a dev/vX.Y push builds and pushes too, but
      # must never land on :latest - the ingestion workflows' scheduled
      # (cron) runs always execute from main and pull :latest unconditionally,
      # so overwriting it from a pre-release branch would put untested code
      # in front of real production data on the next scheduled run. main
      # keeps :latest; every other branch (i.e. dev/**) gets :dev instead -
      # see benchmark-ingestion.yml's "plan" job for the matching pull-side
      # logic.
      - name: Determine image tag
        id: tag
        run: |
          if [ "${{ github.ref }}" = "refs/heads/main" ]; then
            echo "tag=latest" >> "$GITHUB_OUTPUT"
          else
            echo "tag=dev" >> "$GITHUB_OUTPUT"
          fi

      - name: Build and push equicast-benchmark (private)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: packages/benchmark/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/equicast-benchmark:${{ steps.tag.outputs.tag }}
            ghcr.io/${{ github.repository_owner }}/equicast-benchmark:${{ github.sha }}
