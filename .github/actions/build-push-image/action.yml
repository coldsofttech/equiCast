name: Build and push equicast Docker image
description: >
  Logs in to GHCR and builds/pushes a private equicast Docker image - the
  per-image build step images.yml's build-and-push matrix calls once per
  asset class (GitHub issue equicast-support#186, follow-up to
  equicast-support#151's workflow-generalisation proposal; images.yml
  itself replaced five near-identical single-image workflows - stock-
  image.yml/etf-image.yml/fx-image.yml/benchmark-image.yml/forecasting-
  image.yml). The calling workflow must check out the repo
  (actions/checkout@v4) before this step - a *local* composite action
  can't check itself out, since the runner needs this file on disk to
  resolve `uses: ./...` in the first place.

  Tags :dev instead of :latest on any branch other than main
  (equicast-support#185) - the ingestion workflows' scheduled (cron) runs
  always execute from main and pull :latest unconditionally, so a build
  from a pre-release dev/vX.Y branch must never overwrite it. Every call
  site's own ingestion workflow resolves which tag to pull the same way
  (see e.g. stock-ingestion.yml's "plan" job).

  Also tags every push with a per-package semantic version
  (equicast-support#166), MAJOR.MINOR read from packages/<name>/
  pyproject.toml (a manual edit - bump it there for a MAJOR/MINOR release).
  This intentionally never writes back to the repo - dev/v1.1 (and main)
  reject direct pushes under a "changes must be made through a pull
  request" ruleset, so an earlier version of this action that committed
  the bumped version back to pyproject.toml failed every build. Reading
  GHCR's existing tags instead needs `packages-token` (a classic PAT - see
  package-cleanup.yml's header for why GITHUB_TOKEN can't list a
  user-owned package's versions); until that secret exists every build
  just retags MAJOR.MINOR.0.

  PATCH is a separate counter per branch, not one shared between main and
  dev/** - main gets a clean release tag (MAJOR.MINOR.PATCH, one past the
  highest existing *clean* tag), dev/** gets a pre-release tag
  (MAJOR.MINOR.0-dev.N, one past the highest existing *-dev.N* tag). The
  two patterns can never produce the same string, so a dev build and a
  main build can never end up fighting over one tag - an earlier version
  of this action used one plain MAJOR.MINOR.PATCH counter for both
  branches, and a dev push landing close to a main push (e.g. around a
  release merge) could compute the same "next" patch as the main push
  before either had pushed, silently overwriting one image's tag with the
  other's. images.yml's per-image `concurrency` group is a second layer
  against that same race (still possible within one branch's own counter
  if two builds of the same image overlap).

inputs:
  image-name:
    description: 'GHCR image name, e.g. "equicast-stock".'
    required: true
  dockerfile:
    description: 'Path to the Dockerfile, e.g. "packages/stock/Dockerfile".'
    required: true
  package-dir:
    description: 'Path to the package directory holding pyproject.toml, e.g. "packages/stock".'
    required: true
  packages-token:
    description: >
      Classic PAT (read:packages) used to list this image's existing GHCR
      versions so the next PATCH can be computed. Same token package-
      cleanup.yml uses (secrets.PACKAGES_CLEANUP_PAT) - GITHUB_TOKEN can't
      list a user-owned package's versions.
    required: true

runs:
  using: composite
  steps:
    - name: Log in to GHCR
      uses: docker/login-action@v3
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        # github.token, not secrets.GITHUB_TOKEN - composite actions can't
        # read the secrets context directly, but github.token is the same
        # value under the github context, which they can.
        password: ${{ github.token }}

    - name: Determine image tag
      id: tag
      shell: bash
      run: |
        if [ "${{ github.ref }}" = "refs/heads/main" ]; then
          echo "tag=latest" >> "$GITHUB_OUTPUT"
        else
          echo "tag=dev" >> "$GITHUB_OUTPUT"
        fi

    # MAJOR.MINOR comes from pyproject.toml (developer-controlled). Never
    # written back to the repo (see the header comment for why). A 404
    # (image never published before) or an unauthorized call
    # (packages-token not set up yet) both fall through to an empty tag
    # list, so the first-ever build under a MAJOR.MINOR starts at .0 /
    # -dev.0.
    - name: Determine next version
      id: bump
      shell: bash
      env:
        GH_TOKEN: ${{ inputs.packages-token }}
      run: |
        set -euo pipefail
        file="${{ inputs.package-dir }}/pyproject.toml"
        current=$(grep -oP '^version = "\K[^"]+' "$file")
        major=$(cut -d. -f1 <<< "$current")
        minor=$(cut -d. -f2 <<< "$current")

        all_tags=$(gh api "users/${{ github.repository_owner }}/packages/container/${{ inputs.image-name }}/versions" \
          --paginate --jq '.[].metadata.container.tags[]?' 2>/dev/null || true)

        # main gets a clean release counter; dev/** gets its own
        # pre-release counter that can never collide with main's (see the
        # header comment).
        if [ "${{ steps.tag.outputs.tag }}" = "latest" ]; then
          pattern="^${major}\.${minor}\.([0-9]+)$"
        else
          pattern="^${major}\.${minor}\.0-dev\.([0-9]+)$"
        fi

        max_n=-1
        while IFS= read -r t; do
          if [[ "$t" =~ $pattern ]]; then
            n="${BASH_REMATCH[1]}"
            if [ "$n" -gt "$max_n" ]; then
              max_n="$n"
            fi
          fi
        done <<< "$all_tags"

        next_n=$((max_n + 1))
        if [ "${{ steps.tag.outputs.tag }}" = "latest" ]; then
          next="$major.$minor.$next_n"
        else
          next="$major.$minor.0-dev.$next_n"
        fi
        echo "version=$next" >> "$GITHUB_OUTPUT"

    - name: Build and push
      uses: docker/build-push-action@v6
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        push: true
        tags: |
          ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ steps.tag.outputs.tag }}
          ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ github.sha }}
          ghcr.io/${{ github.repository_owner }}/${{ inputs.image-name }}:${{ steps.bump.outputs.version }}
