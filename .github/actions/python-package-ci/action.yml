name: Python package CI
description: >
  Lints, type-checks, and tests one Python package directory (GitHub issue
  equicast-support#188, follow-up to equicast-support#151's workflow-
  generalisation proposal) - replaces the identical astral-sh/setup-uv@v3
  + `uv sync` + `ruff check` + mypy/pytest steps duplicated across the old
  stock-ci.yml/etf-ci.yml/fx-ci.yml/benchmark-ci.yml (now packages-ci.yml's
  per-package matrix) and reused by backend-ci.yml for packages/core and
  backend/.

  The calling workflow must check out the repo (actions/checkout@v4)
  before this step - a *local* composite action can't check itself out,
  since the runner needs this file on disk to resolve `uses: ./...` in
  the first place (see build-push-image for the same constraint).

  lint-path is optional - leave it unset to skip the lint step, for a
  caller (backend-ci.yml) that runs its own repo-wide `ruff check .`
  separately rather than a per-package one.

inputs:
  working-directory:
    description: 'Package directory to type-check and test, e.g. "packages/stock" or "backend".'
    required: true
  lint-path:
    description: 'Path to ruff-check, e.g. "packages/stock/". Leave unset to skip linting here.'
    required: false
    default: ''
  mypy-target:
    description: 'Path (relative to working-directory) for mypy to check.'
    required: false
    default: 'src/'
  mypy-args:
    description: 'Extra arguments to pass to mypy, e.g. "--ignore-missing-imports".'
    required: false
    default: ''

runs:
  using: composite
  steps:
    - name: Install uv
      uses: astral-sh/setup-uv@v3
      with:
        enable-cache: true

    - name: Install dependencies
      shell: bash
      run: uv sync --all-packages --extra dev

    - name: Lint
      if: inputs.lint-path != ''
      shell: bash
      run: uv run ruff check ${{ inputs.lint-path }}

    - name: Type check
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv run mypy ${{ inputs.mypy-target }} ${{ inputs.mypy-args }}

    - name: Test
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: uv run pytest
